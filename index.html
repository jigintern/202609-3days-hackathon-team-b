<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オシピ！ | 制限内でできる推し活SNS</title>
<meta name="description" content="予算や時間の制限の中で見つけた推し活のアイデアと工夫を投稿・検索できるSNS「オシピ！」">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --bg: #F7F7F7;
  --surface: #FFFFFF;
  --ink: #030303;
  --ink-muted: #5C5C5C;
  --accent: #FFEF6C;
  --line: #E3E3E1;
  --danger: #D8453B;

  --font-display: 'Kiwi Maru', serif;
  --font-body: 'Zen Kaku Gothic New', sans-serif;

  --container-w: 1200px;
  --gutter: clamp(16px, 4vw, 48px);
}

/* ============================================================
   BASE / RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button, select, input { font-family: inherit; }

*:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

.container {
  max-width: var(--container-w);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   LAYOUT: HEADER
   ============================================================ */
.site-header {
  border-bottom: 1px solid var(--line);
}
.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 18px;
}
.site-logo {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: 0.02em;
  text-decoration: none;
}
.btn-primary {
  display: inline-block;
  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.9rem;
  text-decoration: none;
  padding: 0.65em 1.35em;
  border: 1px solid rgba(3, 3, 3, 0.08);
  border-radius: 10px;
  transition: filter 0.15s ease;
}
.btn-primary:hover,
.btn-primary:focus-visible {
  filter: brightness(0.92);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 20px;
}
.nav-link {
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--ink-muted);
  text-decoration: none;
  transition: color 0.15s ease;
}
.nav-link:hover,
.nav-link:focus-visible {
  color: var(--ink);
}
.nav-user {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}

/* ============================================================
   LAYOUT: HERO
   ============================================================ */
.hero {
  padding-block: clamp(32px, 6vw, 56px) clamp(28px, 5vw, 44px);
}
.hero__title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.7rem, 4vw, 2.5rem);
  line-height: 1.5;
  margin: 0;
  max-width: 16em;
}
.hero__subtitle {
  margin: 12px 0 0;
  color: var(--ink-muted);
  font-size: 1rem;
  max-width: 38ch;
}

.hero__controls {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 760px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 16px;
}
.search-box svg { flex: none; opacity: 0.5; }
.search-box input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-size: 0.95rem;
}
.search-box input::placeholder { color: var(--ink-muted); }

.filters-row {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.budget-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.85rem;
  padding: 0.5em 1.1em;
  border-radius: 999px;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.chip.is-active {
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 700;
}

.genre-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--ink-muted);
}
.genre-filter select {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  padding: 0.5em 0.8em;
  font-size: 0.9rem;
}

/* ============================================================
   LAYOUT: FEED
   ============================================================ */
.feed {
  padding-block: 8px 64px;
}
.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
}

.empty-state {
  padding-block: 48px;
  max-width: 42ch;
}
.empty-state h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.3rem;
  margin: 0 0 8px;
}
.empty-state p {
  color: var(--ink-muted);
  margin: 0 0 16px;
}
.empty-state button {
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  padding: 0.6em 1.3em;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}

/* ============================================================
   COMPONENTS: CARD
   ============================================================ */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  overflow: visible;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card:hover, .card:focus-within {
  transform: translateY(-4px);
}
.card__link {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.card__media {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: 14px 14px 0 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card__media-letter {
  font-family: var(--font-display);
  font-size: 4rem;
  color: rgba(3, 3, 3, 0.12);
}
.card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card__price {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
  padding: 0.4em 0.9em 0.4em 1.15em;
  clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%);
}

.card__body {
  padding: 24px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.card__title {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.5;
  margin: 0;
}
.card__meta {
  font-size: 0.82rem;
  color: var(--ink-muted);
  margin: 0;
}
/* 所要時間は探すときの判断材料になりやすいので、他のメタ情報より少しだけ強調する */
.card__duration {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--ink);
  margin: 0;
}
.card__desc {
  font-size: 0.9rem;
  margin: 0;
  opacity: 0.85;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card__footer {
  margin: auto 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card__like-btn {
  position: relative;
  z-index: 2;
  border: none;
  background: none;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.card__like-btn.is-liked {
  color: var(--danger);
  font-weight: 700;
}
.login-required-msg {
  display: inline-block;
  margin-left: 8px;
  font-size: 0.8rem;
  color: var(--danger);
  white-space: nowrap;
}

/* placeholder media gradients — kept as muted neutrals so the yellow price tag stays the only accent moment */
.ph-1 { background: linear-gradient(135deg, #EDEBE4, #DFDCD2); }
.ph-2 { background: linear-gradient(135deg, #E9E6DE, #D8D3C6); }
.ph-3 { background: linear-gradient(135deg, #E7E4DD, #D3CFC3); }
.ph-4 { background: linear-gradient(135deg, #ECE9E2, #DAD6CB); }
.ph-5 { background: linear-gradient(135deg, #E5E2DA, #D6D1C4); }

/* ============================================================
   RESPONSIVE / MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .card, .btn-primary, .chip { transition: none; }
}

@media (max-width: 480px) {
  .site-logo { font-size: 1.3rem; }
  .filters-row { gap: 12px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="site-logo" href="index.html">オシピ！</a>
    <nav class="nav-links">
      <span class="nav-user" id="navUser" hidden></span>
      <a class="nav-link" href="search/index.html">予算で探す</a>
      <a class="btn-primary" href="post/index.html">投稿する</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1 class="hero__title">あなたにも、きっとできる</h1>
    <p class="hero__subtitle">制限の中で見つけた、推し活のアイデアと工夫が集まる場所。</p>

    <div class="hero__controls">
      <div class="search-box" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <label for="keyword-input" class="visually-hidden">投稿をキーワードで検索</label>
        <input id="keyword-input" type="text" placeholder="キーワードで探す（タイトルや本文から）">
      </div>

      <div class="filters-row">
        <div class="budget-chips" role="group" aria-label="予算で絞り込む">
          <button class="chip is-active" type="button" data-max-budget="all" aria-pressed="true">すべて</button>
          <button class="chip" type="button" data-max-budget="1000" aria-pressed="false">¥1,000以下</button>
          <button class="chip" type="button" data-max-budget="3000" aria-pressed="false">¥3,000以下</button>
          <button class="chip" type="button" data-max-budget="5000" aria-pressed="false">¥5,000以下</button>
          <button class="chip" type="button" data-max-budget="10000" aria-pressed="false">¥10,000以下</button>
        </div>

        <div class="genre-filter">
          <label for="genre-select">ジャンル</label>
          <select id="genre-select">
            <option value="all">すべてのジャンル</option>
          </select>
        </div>

        <div class="genre-filter">
          <label for="sort-select">並び替え</label>
          <select id="sort-select">
            <option value="new">新着順</option>
            <option value="popular">いいね順</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</section>

<main class="feed">
  <div class="container">
    <div class="empty-state" id="empty-state" hidden>
      <h2>条件に合う投稿が見つかりませんでした</h2>
      <p>予算やキーワード、ジャンルを変えて、もう一度探してみてください。</p>
      <button type="button" id="reset-filters">絞り込みをリセット</button>
    </div>
    <div class="empty-state" id="fetch-error" hidden>
      <h2>投稿を取得できませんでした</h2>
      <p>通信環境をご確認のうえ、もう一度お試しください。</p>
      <button type="button" id="retry-btn">再試行する</button>
    </div>
    <div class="feed-grid" id="feed-grid"></div>
  </div>
</main>

<script src="shared/common.js"></script>
<script>
/* ============================================================
   API CLIENT
   API_BASE や各種ヘルパーは shared/common.js にある
   ============================================================ */
const FALLBACK_GENRES = [
  { key: "pilgrimage", label: "聖地巡礼" },
  { key: "craft", label: "グッズ制作" },
  { key: "live", label: "参戦" },
  { key: "cafe", label: "推しカフェ" },
  { key: "collection", label: "コレクション" },
  { key: "home", label: "自宅推し活" },
];

async function fetchGenres() {
  try {
    const res = await fetch(`${API_BASE}/api/genres`);
    if (!res.ok) throw new Error(`failed to fetch genres: ${res.status}`);
    const { genres } = await res.json();
    return genres;
  } catch (err) {
    console.error(err);
    return FALLBACK_GENRES;
  }
}

async function fetchPosts({ keyword, maxBudget, genre, sort }) {
  const params = new URLSearchParams({ limit: "100" });
  if (keyword.trim()) params.set("q", keyword.trim());
  if (genre !== "all") params.set("genre", genre);
  if (Number.isFinite(maxBudget)) params.set("budgetMax", String(maxBudget));
  if (sort && sort !== "new") params.set("sort", sort);

  const res = await fetch(`${API_BASE}/api/posts?${params.toString()}`);
  if (!res.ok) throw new Error(`failed to fetch posts: ${res.status}`);
  const { posts } = await res.json();
  return posts;
}

/* ============================================================
   ログイン状態（認証がないためlocalStorageのモック）
   ============================================================ */
// ログイン状態はサーバーのセッション（HttpOnly Cookie）が持っているので /api/auth/me で確認する。
// Cookie は別オリジンには渡らないため、ここだけは同一オリジンの相対パスを使う。
let sessionPromise = null;
function fetchCurrentUser() {
  if (!sessionPromise) {
    sessionPromise = fetch("/api/auth/me", { credentials: "include" })
      .then(res => (res.ok ? res.json() : null))
      .then(data => data?.user ?? null)
      .catch(() => null);
  }
  return sessionPromise;
}
async function isLoggedIn() {
  return (await fetchCurrentUser()) !== null;
}

// ヘッダーにログイン中の表示名を出す（未ログインのときは出さない）
fetchCurrentUser().then(user => {
  const el = document.getElementById("navUser");
  if (!el || !user) return;
  el.textContent = user.displayName;
  el.hidden = false;
});

function showLoginRequiredMessage(anchorEl) {
  const existing = anchorEl.parentElement.querySelector(".login-required-msg");
  if (existing) existing.remove();
  const msg = document.createElement("span");
  msg.className = "login-required-msg";
  msg.setAttribute("role", "alert");
  msg.textContent = "ログインが必要です";
  anchorEl.insertAdjacentElement("afterend", msg);
  setTimeout(() => msg.remove(), 2500);
}

/* ============================================================
   RENDER
   ============================================================ */
function renderPostCard(post, index, likedIds) {
  // カード内にいいねボタン(<button>)を置くため、外枠は<a>ではなく<article>にし、
  // 遷移用のリンクは全面を覆う透明な<a>として別に重ねる(<a>はインタラクティブ要素を子孫に持てないため)
  const card = document.createElement("article");
  card.className = "card";

  const cardLink = document.createElement("a");
  cardLink.className = "card__link";
  cardLink.href = `detail/index.html?id=${encodeURIComponent(post.id)}`;
  cardLink.setAttribute("aria-label", `${post.title}の詳細を見る`);
  card.append(cardLink);

  const media = document.createElement("div");
  media.className = `card__media ${placeholderClass(index)}`;

  if (post.images && post.images.length > 0) {
    const img = document.createElement("img");
    img.src = resolveUrl(post.images[0]);
    img.alt = post.title;
    img.loading = "lazy";
    media.append(img);
  } else {
    const letter = document.createElement("span");
    letter.className = "card__media-letter";
    letter.setAttribute("aria-hidden", "true");
    letter.textContent = post.genreLabel.slice(0, 1);
    media.append(letter);
  }

  const price = document.createElement("span");
  price.className = "card__price";
  price.textContent = formatBudget(post.budget);

  media.append(price);

  const body = document.createElement("div");
  body.className = "card__body";

  const title = document.createElement("h3");
  title.className = "card__title";
  title.textContent = post.title;

  // 所要時間は探すときの判断材料になりやすいので、他のメタ情報と分けて少し強調する
  const duration = document.createElement("p");
  duration.className = "card__duration";
  duration.innerHTML = `<span aria-hidden="true">⏱</span>`;
  duration.append(formatDuration(post.durationMin));

  const meta = document.createElement("p");
  meta.className = "card__meta";
  meta.textContent = [post.genreLabel, post.prefecture].filter(Boolean).join(" ・ ");

  const desc = document.createElement("p");
  desc.className = "card__desc";
  desc.textContent = post.body;

  const footer = document.createElement("div");
  footer.className = "card__footer";

  const footerText = document.createElement("span");
  footerText.textContent = `${post.authorName} ・ ${formatDateShort(post.createdAt)}`;

  const likeBtn = document.createElement("button");
  likeBtn.type = "button";
  likeBtn.className = "card__like-btn";
  likeBtn.dataset.id = post.id;
  updateLikeButton(likeBtn, likedIds.has(post.id), post.likeCount);

  footer.append(footerText, likeBtn);

  body.append(title, duration, meta, desc, footer);
  card.append(media, body);
  return card;
}

function renderPostList(posts, likedIds) {
  const grid = document.getElementById("feed-grid");
  const emptyState = document.getElementById("empty-state");

  grid.innerHTML = "";
  const isEmpty = posts.length === 0;
  emptyState.hidden = !isEmpty;
  grid.hidden = isEmpty;

  posts.forEach((post, index) => {
    try {
      grid.appendChild(renderPostCard(post, index, likedIds));
    } catch (err) {
      console.error(`投稿 ${post.id} の描画に失敗しました`, err);
    }
  });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  const state = { keyword: "", maxBudget: Infinity, genre: "all", sort: "new" };
  const likedIds = getLikedIds();

  // いいねボタンはカードが再描画されるので、親要素への委任で1つのリスナーだけ使う
  document.getElementById("feed-grid").addEventListener("click", async (e) => {
    const btn = e.target.closest(".card__like-btn");
    if (!btn || btn.disabled) return;
    e.preventDefault();
    e.stopPropagation();

    if (!(await isLoggedIn())) {
      showLoginRequiredMessage(btn);
      return;
    }

    const postId = btn.dataset.id;
    const nextLiked = !likedIds.has(postId);

    btn.disabled = true;
    try {
      const likeCount = await setPostLike(postId, nextLiked);
      nextLiked ? likedIds.add(postId) : likedIds.delete(postId);
      saveLikedIds(likedIds);
      updateLikeButton(btn, nextLiked, likeCount);
    } catch (err) {
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });

  const keywordInput = document.getElementById("keyword-input");
  const chipButtons = Array.from(document.querySelectorAll(".chip"));
  const genreSelect = document.getElementById("genre-select");
  const sortSelect = document.getElementById("sort-select");
  const resetButton = document.getElementById("reset-filters");
  const emptyState = document.getElementById("empty-state");
  const fetchError = document.getElementById("fetch-error");
  const feedGrid = document.getElementById("feed-grid");

  // 絞り込みを素早く切り替えると複数のリクエストが並行するので、
  // 連番を振って最新のリクエストの結果だけを反映する
  let requestSeq = 0;

  async function applyFilters() {
    const seq = ++requestSeq;
    emptyState.hidden = true;
    fetchError.hidden = true;

    try {
      const posts = await fetchPosts(state);
      if (seq !== requestSeq) return;
      renderPostList(posts, likedIds);
    } catch (err) {
      if (seq !== requestSeq) return;
      console.error(err);
      feedGrid.innerHTML = "";
      feedGrid.hidden = true;
      fetchError.hidden = false;
    }
  }
  const applyFiltersDebounced = debounce(applyFilters, 300);

  keywordInput.addEventListener("input", (event) => {
    state.keyword = event.target.value;
    applyFiltersDebounced();
  });

  chipButtons.forEach((button) => {
    button.addEventListener("click", () => {
      chipButtons.forEach((b) => {
        b.classList.remove("is-active");
        b.setAttribute("aria-pressed", "false");
      });
      button.classList.add("is-active");
      button.setAttribute("aria-pressed", "true");

      const raw = button.dataset.maxBudget;
      state.maxBudget = raw === "all" ? Infinity : Number(raw);
      applyFilters();
    });
  });

  genreSelect.addEventListener("change", (event) => {
    state.genre = event.target.value;
    applyFilters();
  });

  sortSelect.addEventListener("change", (event) => {
    state.sort = event.target.value;
    applyFilters();
  });

  document.getElementById("retry-btn").addEventListener("click", applyFilters);

  resetButton.addEventListener("click", () => {
    state.keyword = "";
    state.maxBudget = Infinity;
    state.genre = "all";
    state.sort = "new";

    keywordInput.value = "";
    genreSelect.value = "all";
    sortSelect.value = "new";
    chipButtons.forEach((b) => {
      const isAll = b.dataset.maxBudget === "all";
      b.classList.toggle("is-active", isAll);
      b.setAttribute("aria-pressed", String(isAll));
    });

    applyFilters();
  });

  fetchGenres().then((genres) => {
    genres.forEach(({ key, label }) => {
      const option = document.createElement("option");
      option.value = key;
      option.textContent = label;
      genreSelect.append(option);
    });
  });

  applyFilters();
});
</script>
</body>
</html>
