<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --bg: #F7F7F7;
  --surface: #FFFFFF;
  --ink: #030303;
  --ink-muted: #5C5C5C;
  --accent: #FFEF6C;
  --line: #E3E3E1;
  --danger: #D8453B;

  --font-display: 'Kiwi Maru', serif;
  --font-body: 'Zen Kaku Gothic New', sans-serif;

  --container-w: 1200px;
  --gutter: clamp(16px, 4vw, 48px);
}

/* ============================================================
   BASE / RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button, select, input { font-family: inherit; }

*:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

.container {
  max-width: var(--container-w);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   LAYOUT: HEADER
   ============================================================ */
.site-header {
  border-bottom: 1px solid var(--line);
}
.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 18px;
}
.site-logo {

  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: 0.02em;
  text-decoration: none;
}
.btn-primary {

  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.9rem;
  text-decoration: none;
  padding: 0.65em 1.35em;
  border: 1px solid rgba(3, 3, 3, 0.08);
  border-radius: 10px;
  transition: filter 0.15s ease;
}
.btn-primary:hover,
.btn-primary:focus-visible {
  filter: brightness(0.92);
}

/* ============================================================
   LAYOUT: HERO
   ============================================================ */
.hero {
  padding-block: clamp(32px, 6vw, 56px) clamp(28px, 5vw, 44px);
}
.hero__title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.7rem, 4vw, 2.5rem);

  margin: 0;
  max-width: 16em;
}
.hero__subtitle {

  color: var(--ink-muted);
  font-size: 1rem;
  max-width: 38ch;
}

.hero__controls {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 760px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 16px;
}
.search-box svg { flex: none; opacity: 0.5; }
.search-box input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-size: 0.95rem;
}
.search-box input::placeholder { color: var(--ink-muted); }

.filters-row {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.budget-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.85rem;
  padding: 0.5em 1.1em;
  border-radius: 999px;
  cursor: pointer;
  font-variant-numeric: tabular-nums;

}
.chip.is-active {
  background: var(--accent);

}

.genre-filter {

  gap: 8px;

/* ============================================================

.card__body {

/* ============================================================
   DATA ACCESS LAYER（将来: ここをAPI呼び出しに差し替える）
   ============================================================ */
function getAllPosts() {
  return MOCK_POSTS;
}

/* ============================================================
   FILTER
   ============================================================ */
function filterPosts(posts, { keyword, maxBudget, genre }) {
  const kw = keyword.trim().toLowerCase();
  return posts.filter((post) => {
    if (genre !== "all" && post.genre !== genre) return false;
    if (Number.isFinite(maxBudget) && post.budget > maxBudget) return false;
    if (kw) {
      const haystack = `${post.title} ${post.description} ${post.genre} ${post.prefecture}`.toLowerCase();
      if (!haystack.includes(kw)) return false;
    }
    return true;
  });
}

/* ============================================================
   FORMAT HELPERS
   ============================================================ */
function formatBudget(yen) {
  return yen === 0 ? "無料" : `¥${yen.toLocaleString("ja-JP")}`;
}
function formatDuration(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h && m) return `${h}時間${m}分`;
  if (h) return `${h}時間`;
  return `${m}分`;
}
function formatDate(isoDate) {
  const d = new Date(isoDate);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function placeholderClass(index) {
  return `ph-${(index % 5) + 1}`;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderPostCard(post, index) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = `detail/index.html?id=${encodeURIComponent(post.id)}`;

  const media = document.createElement("div");
  media.className = `card__media ${placeholderClass(index)}`;

  const letter = document.createElement("span");
  letter.className = "card__media-letter";
  letter.setAttribute("aria-hidden", "true");
  letter.textContent = post.genre.slice(0, 1);

  const price = document.createElement("span");
  price.className = "card__price";
  price.textContent = formatBudget(post.budget);

  media.append(letter, price);

  const body = document.createElement("div");
  body.className = "card__body";

  const title = document.createElement("h3");
  title.className = "card__title";
  title.textContent = post.title;

  const meta = document.createElement("p");
  meta.className = "card__meta";
  meta.textContent = `${post.genre} ・ ${post.prefecture} ・ ${formatDuration(post.durationMinutes)}`;

  const desc = document.createElement("p");
  desc.className = "card__desc";
  desc.textContent = post.description;

  const footer = document.createElement("div");
  footer.className = "card__footer";

  const footerText = document.createElement("span");
  footerText.textContent = `${post.author.name} ・ ${formatDate(post.postedAt)}`;

  const likeBtn = document.createElement("button");
  likeBtn.type = "button";
  likeBtn.className = `card__like-btn${post.liked ? " is-liked" : ""}`;
  likeBtn.dataset.id = post.id;
  likeBtn.setAttribute("aria-pressed", String(post.liked));
  likeBtn.setAttribute("aria-label", `いいね ${post.likeCount}件`);
  likeBtn.innerHTML = `<span aria-hidden="true">${post.liked ? "❤️" : "🤍"}</span>${post.likeCount}`;

  footer.append(footerText, likeBtn);

  body.append(title, meta, desc, footer);
  card.append(media, body);
  return card;
}

function renderPostList(posts) {
  const grid = document.getElementById("feed-grid");
  const emptyState = document.getElementById("empty-state");

  grid.innerHTML = "";
  const isEmpty = posts.length === 0;
  emptyState.hidden = !isEmpty;
  grid.hidden = isEmpty;

  posts.forEach((post, index) => grid.appendChild(renderPostCard(post, index)));
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  const state = { keyword: "", maxBudget: Infinity, genre: "all" };

  // いいねボタンはカードが再描画されるので、親要素への委任で1つのリスナーだけ使う
  document.getElementById("feed-grid").addEventListener("click", (e) => {
    const btn = e.target.closest(".card__like-btn");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const post = MOCK_POSTS.find((p) => p.id === btn.dataset.id);
    if (!post) return;
    post.liked = !post.liked;
    post.likeCount += post.liked ? 1 : -1;

    btn.classList.toggle("is-liked", post.liked);
    btn.setAttribute("aria-pressed", String(post.liked));
    btn.setAttribute("aria-label", `いいね ${post.likeCount}件`);
    btn.innerHTML = `<span aria-hidden="true">${post.liked ? "❤️" : "🤍"}</span>${post.likeCount}`;
  });

  const keywordInput = document.getElementById("keyword-input");
  const chipButtons = Array.from(document.querySelectorAll(".chip"));
  const genreSelect = document.getElementById("genre-select");
  const resetButton = document.getElementById("reset-filters");

  function applyFilters() {
    renderPostList(filterPosts(getAllPosts(), state));
  }

  keywordInput.addEventListener("input", (event) => {
    state.keyword = event.target.value;
    applyFilters();
  });

  chipButtons.forEach((button) => {
    button.addEventListener("click", () => {
      chipButtons.forEach((b) => {
        b.classList.remove("is-active");
        b.setAttribute("aria-pressed", "false");
      });
      button.classList.add("is-active");
      button.setAttribute("aria-pressed", "true");

      const raw = button.dataset.maxBudget;
      state.maxBudget = raw === "all" ? Infinity : Number(raw);
      applyFilters();
    });
  });

  genreSelect.addEventListener("change", (event) => {
    state.genre = event.target.value;
    applyFilters();
  });

  resetButton.addEventListener("click", () => {
    state.keyword = "";
    state.maxBudget = Infinity;
    state.genre = "all";

    keywordInput.value = "";
    genreSelect.value = "all";
    chipButtons.forEach((b) => {
      const isAll = b.dataset.maxBudget === "all";
      b.classList.toggle("is-active", isAll);
      b.setAttribute("aria-pressed", String(isAll));
    });

    applyFilters();
  });

  applyFilters();
});
</script>
</body>
</html>
