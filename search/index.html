<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予算で探す | 推し活シェア</title>
<style>
  /* ===== 1. デザイントークン ===== */
  :root {
    /* アクセント（黄色） */
    --color-accent: #FFEF6C;
    --color-accent-dark: #E6D64A;
    --color-accent-text: #4A4520;

    /* ニュートラル */
    --color-bg: #FAFAF6;
    --color-surface: #FFFFFF;
    --color-border: #E7E6DF;
    --color-text-primary: #1F1F1D;
    --color-text-secondary: #6B6B62;
    --color-text-muted: #9C9C90;

    /* フォーカス（アクセント黄色は使わない） */
    --color-focus-ring: #3B7DD8;

    /* 形状 */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-card-hover: 0 8px 20px rgba(0, 0, 0, 0.10);

    /* スペーシング */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-8: 48px;

    /* タイポグラフィ */
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", Meiryo, sans-serif;
    --fs-sm: 0.8125rem;
    --fs-base: 1rem;
    --fs-md: 1.125rem;
    --fs-lg: 1.375rem;
    --fs-xl: 1.75rem;
  }

  /* ===== 2. リセット / 基本スタイル ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text-primary);
    font-size: var(--fs-base);
    line-height: 1.6;
  }

  h1, h2, h3 {
    margin: 0;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  input {
    font-family: inherit;
    font-size: var(--fs-base);
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  :focus-visible {
    outline: 2px solid var(--color-focus-ring);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ===== 3. レイアウト ===== */
  .page-header {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-4) var(--space-5);
  }

  .page-header h1 {
    font-size: var(--fs-lg);
  }

  .page-header .logo-accent {
    color: var(--color-accent-text);
    background: var(--color-accent);
    padding: 0 var(--space-2);
    border-radius: var(--radius-sm);
  }

  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--space-5);
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-6);
  }

  /* ===== 4. フィルターパネル ===== */
  .filter-panel {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    box-shadow: var(--shadow-card);
    align-self: start;
  }

  .filter-panel h2 {
    font-size: var(--fs-md);
    margin-bottom: var(--space-4);
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 var(--space-5) 0;
  }

  legend {
    font-weight: 700;
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    padding: 0 0 var(--space-2) 0;
  }

  .field-label {
    display: block;
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    margin-bottom: var(--space-1);
  }

  .budget-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .budget-field {
    flex: 1 1 100px;
    min-width: 0;
  }

  .budget-field input {
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-bg);
  }

  .budget-sep {
    color: var(--color-text-muted);
    padding-top: var(--space-4);
  }

  /* ジャンルチップ (余裕があれば実装) */
  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .chip {
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-primary);
    border-radius: 999px;
    padding: var(--space-2) var(--space-4);
    font-size: var(--fs-sm);
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .chip:hover {
    border-color: var(--color-accent-dark);
  }

  .chip[aria-pressed="true"] {
    background: var(--color-accent);
    border-color: var(--color-accent-dark);
    color: var(--color-accent-text);
    font-weight: 700;
  }

  /* タグ入力 (余裕があれば実装) */
  .tag-input-row {
    display: flex;
    gap: var(--space-2);
  }

  .tag-input-row input {
    flex: 1;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-bg);
  }

  .tag-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }

  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    background: var(--color-accent);
    color: var(--color-accent-text);
    border-radius: 999px;
    padding: var(--space-1) var(--space-2) var(--space-1) var(--space-3);
    font-size: var(--fs-sm);
    font-weight: 700;
  }

  .tag-chip button {
    background: transparent;
    border: none;
    color: var(--color-accent-text);
    font-size: var(--fs-base);
    line-height: 1;
    padding: var(--space-1);
    border-radius: 50%;
  }

  .tag-chip button:hover {
    background: rgba(0, 0, 0, 0.08);
  }

  .filter-actions {
    display: flex;
    gap: var(--space-3);
    margin-top: var(--space-2);
  }

  .btn {
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
    font-size: var(--fs-base);
    font-weight: 700;
    border: 1px solid transparent;
    white-space: nowrap;
    flex: 1;
  }

  .btn-primary {
    background: var(--color-accent);
    color: var(--color-accent-text);
    border-color: var(--color-accent-dark);
  }

  .btn-primary:hover {
    background: var(--color-accent-dark);
  }

  .btn-secondary {
    background: var(--color-surface);
    color: var(--color-text-secondary);
    border-color: var(--color-border);
  }

  .btn-secondary:hover {
    border-color: var(--color-text-muted);
  }

  /* ===== 5. 結果エリア ===== */
  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: var(--space-4);
  }

  .results-header h2 {
    font-size: var(--fs-md);
  }

  #results-count {
    color: var(--color-text-secondary);
    font-size: var(--fs-sm);
    margin: 0;
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: var(--space-5);
  }

  .empty-state {
    text-align: center;
    color: var(--color-text-secondary);
    padding: var(--space-8) var(--space-4);
    background: var(--color-surface);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-lg);
  }

  /* ===== 6. カード ===== */
  .post-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    height: 100%;
  }

  .post-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-card-hover);
  }

  .post-card__link {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ===== 7. プレースホルダー画像 ===== */
  .post-card__thumb {
    aspect-ratio: 16 / 9;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }

  .post-card__body {
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    flex: 1;
  }

  .badge {
    display: inline-block;
    align-self: flex-start;
    background: var(--color-accent);
    color: var(--color-accent-text);
    font-size: var(--fs-sm);
    font-weight: 700;
    padding: var(--space-1) var(--space-3);
    border-radius: 999px;
  }

  .post-card__title {
    font-size: var(--fs-md);
    line-height: 1.4;
  }

  .post-card__teaser {
    color: var(--color-text-secondary);
    font-size: var(--fs-sm);
    margin: 0;
    flex: 1;
  }

  .post-card__meta {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1) var(--space-4);
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    border-top: 1px solid var(--color-border);
    padding-top: var(--space-3);
    margin-top: var(--space-2);
  }

  .post-card__meta li {
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }

  .post-card__meta .meta-budget {
    color: var(--color-text-primary);
    font-weight: 700;
  }

  /* ===== 8. レスポンシブ ===== */
  @media (min-width: 640px) {
    .budget-row {
      flex-wrap: nowrap;
    }
  }

  @media (min-width: 1024px) {
    .layout {
      grid-template-columns: 280px 1fr;
      align-items: start;
    }

    .filter-panel {
      position: sticky;
      top: var(--space-5);
    }
  }
</style>
</head>
<body>
  <header class="page-header">
    <h1><span class="logo-accent">推し活</span>シェア</h1>
  </header>

  <main class="container">
    <div class="layout">
      <section class="filter-panel" aria-labelledby="filter-heading">
        <h2 id="filter-heading">予算で探す</h2>
        <form id="search-form">
          <fieldset>
            <legend>予算で絞り込む</legend>
            <div class="budget-row">
              <div class="budget-field">
                <label class="field-label" for="budget-min">最低 (円)</label>
                <input type="number" id="budget-min" name="budgetMin" min="0" step="100" placeholder="0" inputmode="numeric">
              </div>
              <span class="budget-sep" aria-hidden="true">〜</span>
              <div class="budget-field">
                <label class="field-label" for="budget-max">最高 (円)</label>
                <input type="number" id="budget-max" name="budgetMax" min="0" step="100" placeholder="上限なし" inputmode="numeric">
              </div>
            </div>
          </fieldset>

          <!-- NICE-TO-HAVE: ジャンルで絞り込む。バックエンド接続時は投稿データのgenreフィールドと連携する -->
          <fieldset>
            <legend id="genre-legend">ジャンルで絞り込む</legend>
            <div class="chip-group" id="genre-chip-group" role="group" aria-labelledby="genre-legend"></div>
          </fieldset>

          <!-- NICE-TO-HAVE: やりたい分野をハッシュタグ的に指定。バックエンド接続時は本文中のタグ検索APIに置き換える -->
          <fieldset>
            <legend>やりたい分野を追加</legend>
            <div class="tag-input-row">
              <label for="tag-input" class="sr-only">やりたい分野を入力してEnterで追加</label>
              <input type="text" id="tag-input" placeholder="例: 写真, 手作り">
            </div>
            <ul class="tag-chip-list" id="tag-chip-list"></ul>
          </fieldset>

          <div class="filter-actions">
            <button type="submit" class="btn btn-primary">検索する</button>
            <button type="button" class="btn btn-secondary" id="reset-btn">条件をクリア</button>
          </div>
        </form>
      </section>

      <section class="results-section" aria-labelledby="results-heading">
        <div class="results-header">
          <h2 id="results-heading">検索結果</h2>
          <p id="results-count" aria-live="polite"></p>
        </div>
        <ul class="results-grid" id="results-grid"></ul>
        <p class="empty-state" id="empty-state" aria-live="polite" hidden>条件に合う投稿が見つかりませんでした。条件を変えて試してみてください。</p>
      </section>
    </div>
  </main>

        tags: ["推しカラー", "推しカフェ"],
        thumbnailGradient: ["#D9A7C7", "#FFFCDC"], thumbnailIcon: "🍰",

      },
      {
        id: "p010", title: "100均素材だけの推しぬい服作り",
        genre: "craft", genreLabel: "グッズ制作", prefecture: "北海道",
        budget: 1000, durationMin: 90,
        teaser: "型紙不要、裁縫初心者でも1時間で完成",
        body: "フェルトと接着剤中心で完結する、推しぬい用の裁縫なしクラフト。",
        tags: ["推しぬい", "初心者向け", "ハンドメイド"],
        thumbnailGradient: ["#C2FFD8", "#465EFB"], thumbnailIcon: "🧸",
        imageAlt: "推しぬいの服のイメージ画像", authorName: "ゆず", createdAt: "2026-08-21",
      },
    ];

    const filterState = {
      budgetMin: null,
      budgetMax: null,
      genres: new Set(),
      tags: [],
    };

    function formatBudget(yen) {
      if (yen === 0) return "無料";
      return yen.toLocaleString("ja-JP") + "円";
    }

    function formatDuration(min) {
      if (min < 60) return min + "分";
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m === 0 ? h + "時間" : h + "時間" + m + "分";
    }

    function renderGenreChips() {
      const group = document.getElementById("genre-chip-group");
      group.innerHTML = "";
      GENRES.forEach((g) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = g.label;
        btn.dataset.genre = g.key;
        btn.setAttribute("aria-pressed", "false");
        btn.addEventListener("click", () => {
          if (filterState.genres.has(g.key)) {
            filterState.genres.delete(g.key);
            btn.setAttribute("aria-pressed", "false");
          } else {
            filterState.genres.add(g.key);
            btn.setAttribute("aria-pressed", "true");
          }
          applyFilters();
        });
        group.appendChild(btn);
      });
    }

    function renderTagChips() {
      const list = document.getElementById("tag-chip-list");
      list.innerHTML = "";
      filterState.tags.forEach((tag) => {
        const li = document.createElement("li");
        li.className = "tag-chip";
        const span = document.createElement("span");
        span.textContent = "#" + tag;
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.textContent = "×";
        removeBtn.setAttribute("aria-label", tag + "タグを削除");
        removeBtn.addEventListener("click", () => {
          filterState.tags = filterState.tags.filter((t) => t !== tag);
          renderTagChips();
          applyFilters();
        });
        li.appendChild(span);
        li.appendChild(removeBtn);
        list.appendChild(li);
      });
    }

    function addTagFromInput() {
      const input = document.getElementById("tag-input");
      const value = input.value.trim().replace(/^#/, "");
      if (value && !filterState.tags.includes(value)) {
        filterState.tags.push(value);
        renderTagChips();
        applyFilters();
      }
      input.value = "";
    }

    function matchesFilters(post) {
      const { budgetMin, budgetMax, genres, tags } = filterState;
      if (budgetMin !== null && post.budget < budgetMin) return false;
      if (budgetMax !== null && post.budget > budgetMax) return false;
      if (genres.size > 0 && !genres.has(post.genre)) return false;
      if (tags.length > 0) {
        const haystack = (post.title + " " + post.teaser + " " + post.tags.join(" ")).toLowerCase();
        const matchesAnyTag = tags.some((t) => haystack.includes(t.toLowerCase()));
        if (!matchesAnyTag) return false;
      }
      return true;
    }

    function renderCard(post) {
      const li = document.createElement("li");
      li.innerHTML = `
        <article class="post-card">
          <a class="post-card__link" href="../detail/index.html?id=${post.id}" aria-label="${post.title}、${post.genreLabel}、予算${formatBudget(post.budget)}の詳細を見る">
            <div class="post-card__thumb" style="background: linear-gradient(135deg, ${post.thumbnailGradient[0]}, ${post.thumbnailGradient[1]});" role="img" aria-label="${post.imageAlt}">
              <span aria-hidden="true">${post.thumbnailIcon}</span>
            </div>
            <div class="post-card__body">
              <span class="badge">${post.genreLabel}</span>
              <h3 class="post-card__title">${post.title}</h3>
              <p class="post-card__teaser">${post.teaser}</p>
              <ul class="post-card__meta">
                <li><span aria-hidden="true">📍</span>${post.prefecture}</li>
                <li><span aria-hidden="true">⏱</span>${formatDuration(post.durationMin)}</li>
                <li class="meta-budget"><span aria-hidden="true">💰</span>${formatBudget(post.budget)}</li>
              </ul>
            </div>
          </a>
        </article>
      `;
      return li;
    }

    function render(posts) {
      const grid = document.getElementById("results-grid");
      const emptyState = document.getElementById("empty-state");
      const countEl = document.getElementById("results-count");

      grid.innerHTML = "";
      posts.forEach((post) => grid.appendChild(renderCard(post)));

      countEl.textContent = posts.length + "件見つかりました";
      emptyState.hidden = posts.length > 0;
      grid.hidden = posts.length === 0;
    }

    function applyFilters() {
      const filtered = MOCK_POSTS.filter(matchesFilters);
      render(filtered);
    }

    function initEvents() {
      const form = document.getElementById("search-form");
      const budgetMin = document.getElementById("budget-min");
      const budgetMax = document.getElementById("budget-max");
      const tagInput = document.getElementById("tag-input");
      const resetBtn = document.getElementById("reset-btn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        applyFilters();
      });

      budgetMin.addEventListener("input", () => {
        filterState.budgetMin = budgetMin.value === "" ? null : Number(budgetMin.value);
        applyFilters();
      });

      budgetMax.addEventListener("input", () => {
        filterState.budgetMax = budgetMax.value === "" ? null : Number(budgetMax.value);
        applyFilters();
      });

      tagInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          addTagFromInput();
        }
      });

      resetBtn.addEventListener("click", () => {
        filterState.budgetMin = null;
        filterState.budgetMax = null;
        filterState.genres.clear();
        filterState.tags = [];
        budgetMin.value = "";
        budgetMax.value = "";
        tagInput.value = "";
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
        renderTagChips();
        applyFilters();
      });
    }

    renderGenreChips();
    renderTagChips();
    initEvents();
    applyFilters();
  </script>
</body>
</html>
