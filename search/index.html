<style>
/* ============================================================
   TOKENS（トップページ・投稿ページと共通）
   ============================================================ */
:root {
  --bg: #F7F7F7;
  --surface: #FFFFFF;
  --ink: #030303;
  --ink-muted: #5C5C5C;
  --accent: #FFEF6C;
  --accent-dark: #E6D64A;
  --line: #E3E3E1;

  --font-display: 'Kiwi Maru', serif;
  --font-body: 'Zen Kaku Gothic New', sans-serif;

  --container-w: 1200px;
  --gutter: clamp(16px, 4vw, 48px);
}

/* ============================================================
   BASE / RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button, select, input, textarea { font-family: inherit; }

*:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

.container {
  max-width: var(--container-w);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  border-bottom: 1px solid var(--line);
}
.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 18px;
}
.site-logo {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: 0.02em;
  text-decoration: none;
}
.btn-primary {
  display: inline-block;
  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.9rem;
  text-decoration: none;
  padding: 0.65em 1.35em;
  border: 1px solid rgba(3, 3, 3, 0.08);
  border-radius: 10px;
  transition: filter 0.15s ease;
}
.btn-primary:hover,
.btn-primary:focus-visible {
  filter: brightness(0.92);
}

/* ============================================================
   PAGE INTRO
   ============================================================ */
.page-intro {
  padding-block: clamp(24px, 5vw, 40px) 0;
}
.page-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.4rem, 3.5vw, 1.9rem);
  margin: 0;
}
.page-lead {
  margin: 8px 0 0;
  color: var(--ink-muted);
  font-size: 0.9rem;
  max-width: 46ch;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.layout {
  padding-block: 24px 64px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

/* ============================================================
   FILTER PANEL
   ============================================================ */
.filter-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  align-self: start;
}

.filter-panel .field-group {
  margin: 0 0 20px;
}
.filter-panel .field-group:last-of-type {
  margin-bottom: 0;
}

.filter-panel legend,
.filter-panel .field-group__label {
  display: block;
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 8px;
}

fieldset { border: none; padding: 0; margin: 0; }

.budget-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.budget-field {
  flex: 1 1 100px;
  min-width: 0;
}
.budget-field label {
  display: block;
  font-size: 0.75rem;
  color: var(--ink-muted);
  margin-bottom: 4px;
}
.budget-sep {
  color: var(--ink-muted);
  padding-top: 18px;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  padding: 0.6em 0.75em;
  font-size: 0.9rem;
}
input:focus { outline: none; border-color: var(--accent-dark); }

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.85rem;
  padding: 0.5em 1.1em;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.chip.is-active {
  background: var(--accent);
  border-color: var(--accent-dark);
  font-weight: 700;
}

.tag-input-row {
  display: flex;
  gap: 8px;
}
.tag-input-row input { flex: 1; min-width: 0; }

.tag-chip-list {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--accent);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.3em 0.4em 0.3em 0.9em;
  font-size: 0.8rem;
  font-weight: 700;
}
.tag-chip button {
  background: transparent;
  border: none;
  color: var(--ink);
  font-size: 0.95rem;
  line-height: 1;
  padding: 0.3em;
  border-radius: 50%;
  cursor: pointer;
}
.tag-chip button:hover { background: rgba(3, 3, 3, 0.08); }

.filter-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.filter-actions .btn {
  flex: 1;
  white-space: nowrap;
  border-radius: 10px;
  padding: 0.75em 1em;
  font-size: 0.9rem;
  font-weight: 700;
  border: 1px solid transparent;
  cursor: pointer;
}
.btn-search {
  background: var(--accent);
  color: var(--ink);
  border-color: var(--accent-dark);
}
.btn-search:hover { background: var(--accent-dark); }
.btn-clear {
  background: var(--surface);
  color: var(--ink-muted);
  border-color: var(--line);
}
.btn-clear:hover { border-color: var(--ink-muted); }

/* ============================================================
   RESULTS
   ============================================================ */
.results-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.results-header h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.15rem;
  margin: 0;
}
#results-count {
  color: var(--ink-muted);
  font-size: 0.85rem;
  margin: 0;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}

.empty-state {
  padding-block: 48px;
  max-width: 42ch;
}
.empty-state h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.2rem;
  margin: 0 0 8px;
}
.empty-state p {
  color: var(--ink-muted);
  margin: 0 0 16px;
}
.empty-state button {
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  padding: 0.6em 1.3em;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}

/* ============================================================
   CARD（トップページと共通のコンポーネント）
   ============================================================ */
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  overflow: visible;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card:hover, .card:focus-visible {
  transform: translateY(-4px);
}

.card__media {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: 14px 14px 0 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card__media-letter {
  font-family: var(--font-display);
  font-size: 4rem;
  color: rgba(3, 3, 3, 0.12);
}
.card__price {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
  padding: 0.4em 0.9em 0.4em 1.15em;
  clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%);
}

.card__body {
  padding: 24px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.card__genre-badge {
  display: inline-block;
  align-self: flex-start;
  background: var(--accent);
  color: var(--ink);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.2em 0.8em;
  border-radius: 999px;
}
.card__title {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.5;
  margin: 0;
}
.card__meta {
  font-size: 0.82rem;
  color: var(--ink-muted);
  margin: 0;
}
.card__desc {
  font-size: 0.9rem;
  margin: 0;
  opacity: 0.85;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card__footer {
  margin: auto 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
  color: var(--ink-muted);
}

/* placeholder media gradients — muted neutrals so the yellow price tag stays the only accent moment */
.ph-1 { background: linear-gradient(135deg, #EDEBE4, #DFDCD2); }
.ph-2 { background: linear-gradient(135deg, #E9E6DE, #D8D3C6); }
.ph-3 { background: linear-gradient(135deg, #E7E4DD, #D3CFC3); }
.ph-4 { background: linear-gradient(135deg, #ECE9E2, #DAD6CB); }
.ph-5 { background: linear-gradient(135deg, #E5E2DA, #D6D1C4); }

/* ============================================================
   RESPONSIVE / MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .card, .btn-primary, .chip { transition: none; }
}

@media (min-width: 640px) {
  .budget-row { flex-wrap: nowrap; }
}

@media (min-width: 1024px) {
  .layout {
    grid-template-columns: 260px 1fr;
    align-items: start;
  }
  .filter-panel {
    position: sticky;
    top: 24px;
  }
}

@media (max-width: 480px) {
  .site-logo { font-size: 1.3rem; }
}
</style>
</head>

    return String(str).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));
  }

  function formatBudget(yen) {
    return yen === 0 ? "無料" : `¥${yen.toLocaleString("ja-JP")}`;
  }

  function formatDuration(min) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    if (h && m) return `${h}時間${m}分`;
    if (h) return `${h}時間`;
    return `${m}分`;
  }

  function formatDate(isoDate) {
    const d = new Date(isoDate);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function placeholderClass(index) {
    return `ph-${(index % 5) + 1}`;
  }

  function debounce(fn, wait) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), wait);
    };
  }

  /* ============================================================
     GENRE CHIPS
     ============================================================ */
  function renderGenreChips() {
    const group = document.getElementById("genre-chip-group");
    group.innerHTML = "";
    GENRES.forEach((g) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = g.label;
      btn.dataset.genre = g.key;
      btn.setAttribute("aria-pressed", "false");
      btn.addEventListener("click", () => {
        const active = !filterState.genres.has(g.key);
        if (active) filterState.genres.add(g.key);
        else filterState.genres.delete(g.key);
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-pressed", String(active));
        applyFilters();
      });
      group.appendChild(btn);
    });
  }

  /* ============================================================
     TAG INPUT
     ============================================================ */
  function renderTagChips() {
    const list = document.getElementById("tag-chip-list");
    list.innerHTML = "";
    filterState.tags.forEach((tag) => {
      const li = document.createElement("li");
      li.className = "tag-chip";
      const span = document.createElement("span");
      span.textContent = `#${tag}`;
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.textContent = "×";
      removeBtn.setAttribute("aria-label", `${tag}タグを削除`);
      removeBtn.addEventListener("click", () => {
        filterState.tags = filterState.tags.filter((t) => t !== tag);
        renderTagChips();
        applyFilters();
      });
      li.append(span, removeBtn);
      list.appendChild(li);
    });
  }

  function addTagFromInput() {
    const input = document.getElementById("tag-input");
    const value = input.value.trim().replace(/^#/, "");
    const alreadyAdded = filterState.tags.some((t) => t.toLowerCase() === value.toLowerCase());
    if (value && !alreadyAdded) {
      filterState.tags.push(value);
      renderTagChips();
      applyFilters();
    }
    input.value = "";
  }

  /* ============================================================
     FILTER
     ============================================================ */
  function matchesFilters(post) {
    const { budgetMin, budgetMax, genres, tags } = filterState;
    if (budgetMin !== null && post.budget < budgetMin) return false;
    if (budgetMax !== null && post.budget > budgetMax) return false;
    if (genres.size > 0 && !genres.has(post.genre)) return false;
    if (tags.length > 0) {
      const haystack = `${post.title} ${post.tip} ${post.body} ${post.tags.join(" ")}`.toLowerCase();
      const matchesAllTags = tags.every((t) => haystack.includes(t.toLowerCase()));
      if (!matchesAllTags) return false;
    }
    return true;
  }

  function applyFilters() {
    render(MOCK_POSTS.filter(matchesFilters));
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function renderCard(post, index) {
    const card = document.createElement("a");
    card.className = "card";
    card.href = `../detail/index.html?id=${encodeURIComponent(post.id)}`;
    card.setAttribute(
      "aria-label",
      `${post.title}、${post.genreLabel}、予算${formatBudget(post.budget)}の詳細を見る`
    );

    card.innerHTML = `
      <div class="card__media ${placeholderClass(index)}">
        <span class="card__media-letter" aria-hidden="true">${escapeHtml(post.genreLabel.slice(0, 1))}</span>
        <span class="card__price">${formatBudget(post.budget)}</span>
      </div>
      <div class="card__body">
        <span class="card__genre-badge">${escapeHtml(post.genreLabel)}</span>
        <h3 class="card__title">${escapeHtml(post.title)}</h3>
        <p class="card__meta">${escapeHtml(post.prefecture)} ・ ${formatDuration(post.durationMin)}${post.steps.length > 0 ? ` ・ 手順${post.steps.length}つ` : ""}</p>
        <p class="card__desc">${escapeHtml(post.tip)}</p>
        <p class="card__footer">${escapeHtml(post.author.name)} ・ ${formatDate(post.postedAt)}</p>
      </div>
    `;
    return card;
  }

  function render(posts) {
    const grid = document.getElementById("results-grid");
    const emptyState = document.getElementById("empty-state");
    const countEl = document.getElementById("results-count");

    grid.innerHTML = "";
    posts.forEach((post, index) => grid.appendChild(renderCard(post, index)));

    countEl.textContent = `${posts.length}件見つかりました`;
    emptyState.hidden = posts.length > 0;
    grid.hidden = posts.length === 0;
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  function resetFilters() {
    filterState.budgetMin = null;
    filterState.budgetMax = null;
    filterState.genres.clear();
    filterState.tags = [];

    document.getElementById("budget-min").value = "";
    document.getElementById("budget-max").value = "";
    document.getElementById("tag-input").value = "";
    document.querySelectorAll("#genre-chip-group .chip").forEach((c) => {
      c.classList.remove("is-active");
      c.setAttribute("aria-pressed", "false");
    });
    renderTagChips();
    applyFilters();
  }

  function initEvents() {
    const form = document.getElementById("search-form");
    const budgetMin = document.getElementById("budget-min");
    const budgetMax = document.getElementById("budget-max");
    const tagInput = document.getElementById("tag-input");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      applyFilters();
    });

    const debouncedApply = debounce(applyFilters, 150);

    budgetMin.addEventListener("input", () => {
      filterState.budgetMin = budgetMin.value === "" ? null : Number(budgetMin.value);
      debouncedApply();
    });

    budgetMax.addEventListener("input", () => {
      filterState.budgetMax = budgetMax.value === "" ? null : Number(budgetMax.value);
      debouncedApply();
    });

    tagInput.addEventListener("keydown", (e) => {
      if (e.isComposing) return;
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        addTagFromInput();
      }
    });

    document.getElementById("reset-btn").addEventListener("click", resetFilters);
    document.getElementById("empty-reset-btn").addEventListener("click", resetFilters);
  }

  /* ============================================================
     INIT
     ============================================================ */
  renderGenreChips();
  renderTagChips();
  initEvents();
  applyFilters();
</script>
</body>
</html>
