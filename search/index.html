<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推し活レシピを探す | オシピ！</title>
<meta name="description" content="予算やジャンルでしぼりこんで、みんなの推し活レシピ（投稿）を探せる「オシピ！」の検索ページ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS（トップページ・投稿ページと共通）
   ============================================================ */
:root {
  --bg: #F7F7F7;
  --surface: #FFFFFF;
  --ink: #030303;
  --ink-muted: #5C5C5C;
  --accent: #FFEF6C;
  --accent-dark: #E6D64A;
  --line: #E3E3E1;
  --danger: #D8453B;

  --font-display: 'Kiwi Maru', serif;
  --font-body: 'Zen Kaku Gothic New', sans-serif;

  --container-w: 1200px;
  --gutter: clamp(16px, 4vw, 48px);
}

/* ============================================================
   BASE / RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button, select, input, textarea { font-family: inherit; }

*:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

.container {
  max-width: var(--container-w);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  border-bottom: 1px solid var(--line);
}
.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 18px;
}
.site-logo {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: 0.02em;
  text-decoration: none;
}
.btn-primary {
  display: inline-block;
  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.9rem;
  text-decoration: none;
  padding: 0.65em 1.35em;
  border: 1px solid rgba(3, 3, 3, 0.08);
  border-radius: 10px;
  transition: filter 0.15s ease;
}
.btn-primary:hover,
.btn-primary:focus-visible {
  filter: brightness(0.92);
}

/* ============================================================
   PAGE INTRO
   ============================================================ */
.page-intro {
  padding-block: clamp(24px, 5vw, 40px) 0;
}
.page-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.4rem, 3.5vw, 1.9rem);
  margin: 0;
}
.page-lead {
  margin: 8px 0 0;
  color: var(--ink-muted);
  font-size: 0.9rem;
  max-width: 40em;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.layout {
  padding-block: 24px 64px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

/* ============================================================
   FILTER PANEL
   ============================================================ */
.filter-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  align-self: start;
}

.filter-panel .field-group {
  margin: 0 0 20px;
}
.filter-panel .field-group:last-of-type {
  margin-bottom: 0;
}

.filter-panel legend,
.filter-panel .field-group__label {
  display: block;
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 8px;
}

fieldset { border: none; padding: 0; margin: 0; }

.budget-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.budget-field {
  flex: 1 1 100px;
  min-width: 0;
}
.budget-field label {
  display: block;
  font-size: 0.75rem;
  color: var(--ink-muted);
  margin-bottom: 4px;
}
.budget-sep {
  color: var(--ink-muted);
  padding-top: 18px;
}

.field-error {
  color: var(--danger);
  font-size: 0.8rem;
  margin: 8px 0 0;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 0.8rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.checkbox-row input {
  accent-color: var(--accent-dark);
  flex-shrink: 0;
  cursor: pointer;
}
/* input:focus で outline を消しているので、キーボード操作時の枠線を戻す */
.checkbox-row input:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  padding: 0.6em 0.75em;
  font-size: 0.9rem;
}
input:focus { outline: none; border-color: var(--accent-dark); }

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.85rem;
  padding: 0.5em 1.1em;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.chip.is-active {
  background: var(--accent);
  border-color: var(--accent-dark);
  font-weight: 700;
}

.tag-input-row {
  display: flex;
  gap: 8px;
}
.tag-input-row input { flex: 1; min-width: 0; }

.tag-chip-list {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--accent);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.3em 0.4em 0.3em 0.9em;
  font-size: 0.8rem;
  font-weight: 700;
}
.tag-chip button {
  background: transparent;
  border: none;
  color: var(--ink);
  font-size: 0.95rem;
  line-height: 1;
  padding: 0.3em;
  border-radius: 50%;
  cursor: pointer;
}
.tag-chip button:hover { background: rgba(3, 3, 3, 0.08); }

.filter-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.filter-actions .btn {
  flex: 1;
  white-space: nowrap;
  border-radius: 10px;
  padding: 0.75em 1em;
  font-size: 0.9rem;
  font-weight: 700;
  border: 1px solid transparent;
  cursor: pointer;
}
.btn-search {
  background: var(--accent);
  color: var(--ink);
  border-color: var(--accent-dark);
}
.btn-search:hover { background: var(--accent-dark); }
.btn-clear {
  background: var(--surface);
  color: var(--ink-muted);
  border-color: var(--line);
}
.btn-clear:hover { border-color: var(--ink-muted); }

/* ============================================================
   RESULTS
   ============================================================ */
.results-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.results-header h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.15rem;
  margin: 0;
}
#results-count {
  color: var(--ink-muted);
  font-size: 0.85rem;
  margin: 0;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}
/* display:grid がブラウザ標準の [hidden]{display:none} を打ち消してしまうため、
   JSで grid.hidden = true にしたときに確実に隠れるよう明示する */
.results-grid[hidden] { display: none; }

.empty-state {
  padding-block: 48px;
  max-width: 42ch;
}
.empty-state h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.2rem;
  margin: 0 0 8px;
}
.empty-state p {
  color: var(--ink-muted);
  margin: 0 0 16px;
}
.empty-state button {
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  padding: 0.6em 1.3em;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}

/* ============================================================
   CARD（トップページと共通のコンポーネント）
   ============================================================ */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  overflow: visible;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card:hover, .card:focus-within {
  transform: translateY(-4px);
}
.card__link {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.card__media {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: 14px 14px 0 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card__media-letter {
  font-family: var(--font-display);
  font-size: 4rem;
  color: rgba(3, 3, 3, 0.12);
}
.card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card__price {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: var(--accent);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
  padding: 0.4em 0.9em 0.4em 1.15em;
  clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%);
}

.card__body {
  padding: 24px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.card__genre-badge {
  display: inline-block;
  align-self: flex-start;
  background: var(--accent);
  color: var(--ink);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.2em 0.8em;
  border-radius: 999px;
}
.card__title {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.5;
  margin: 0;
}
.card__meta {
  font-size: 0.82rem;
  color: var(--ink-muted);
  margin: 0;
}
/* 所要時間は探すときの判断材料になりやすいので、他のメタ情報より少しだけ強調する */
.card__duration {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--ink);
  margin: 0;
}
.card__desc {
  font-size: 0.9rem;
  margin: 0;
  opacity: 0.85;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card__footer {
  margin: auto 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card__like-btn {
  position: relative;
  z-index: 2;
  border: none;
  background: none;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.card__like-btn.is-liked {
  color: var(--danger);
  font-weight: 700;
}
.login-required-msg {
  display: inline-block;
  margin-left: 8px;
  font-size: 0.8rem;
  color: var(--danger);
  white-space: nowrap;
}

/* placeholder media gradients — muted neutrals so the yellow price tag stays the only accent moment */
.ph-1 { background: linear-gradient(135deg, #EDEBE4, #DFDCD2); }
.ph-2 { background: linear-gradient(135deg, #E9E6DE, #D8D3C6); }
.ph-3 { background: linear-gradient(135deg, #E7E4DD, #D3CFC3); }
.ph-4 { background: linear-gradient(135deg, #ECE9E2, #DAD6CB); }
.ph-5 { background: linear-gradient(135deg, #E5E2DA, #D6D1C4); }

/* ============================================================
   RESPONSIVE / MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .card, .btn-primary, .chip { transition: none; }
}

@media (min-width: 640px) {
  .budget-row { flex-wrap: nowrap; }
}

@media (min-width: 1024px) {
  .layout {
    grid-template-columns: 260px 1fr;
    align-items: start;
  }
  .filter-panel {
    position: sticky;
    top: 24px;
  }
}

@media (max-width: 480px) {
  .site-logo { font-size: 1.3rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="site-logo" href="../index.html">オシピ！</a>
    <a class="btn-primary" href="../post/index.html">投稿する</a>
  </div>
</header>

<section class="page-intro container">
  <h1 class="page-title">予算・ジャンルで推し活レシピを探す</h1>
  <p class="page-lead">気になる条件でしぼりこんで、みんなの推し活のアイデアと工夫を見つけよう。</p>
</section>

<main class="container layout">
  <section class="filter-panel" aria-labelledby="filter-heading">
    <h2 id="filter-heading" class="visually-hidden">検索条件</h2>
    <form id="search-form">
      <fieldset class="field-group">
        <legend>予算で絞り込む</legend>
        <div class="budget-row">
          <div class="budget-field">
            <label for="budget-min">最低 (円)</label>
            <input type="number" id="budget-min" name="budgetMin" min="0" step="100" placeholder="0" inputmode="numeric">
          </div>
          <span class="budget-sep" aria-hidden="true">〜</span>
          <div class="budget-field">
            <label for="budget-max">最高 (円)</label>
            <input type="number" id="budget-max" name="budgetMax" min="0" step="100" placeholder="上限なし" inputmode="numeric">
          </div>
        </div>
        <p class="field-error" id="budget-error" role="alert" hidden>最低予算は最高予算以下にしてください</p>
        <label class="checkbox-row">
          <input type="checkbox" id="include-null-budget" checked>
          <span>予算未設定の投稿も表示する</span>
        </label>
      </fieldset>

      <!-- APIは durationMax しか受け取れないので、最短の指定や「未設定も表示」は手元で絞り込む -->
      <fieldset class="field-group">
        <legend>所要時間で絞り込む</legend>
        <div class="budget-row">
          <div class="budget-field">
            <label for="duration-min">最短 (分)</label>
            <input type="number" id="duration-min" name="durationMin" min="0" step="10" placeholder="0" inputmode="numeric">
          </div>
          <span class="budget-sep" aria-hidden="true">〜</span>
          <div class="budget-field">
            <label for="duration-max">最長 (分)</label>
            <input type="number" id="duration-max" name="durationMax" min="0" step="10" placeholder="上限なし" inputmode="numeric">
          </div>
        </div>
        <p class="field-error" id="duration-error" role="alert" hidden>最短の時間は最長の時間以下にしてください</p>
        <label class="checkbox-row">
          <input type="checkbox" id="include-null-duration" checked>
          <span>時間未設定の投稿も表示する</span>
        </label>
      </fieldset>

      <!-- ジャンル一覧は GET /api/genres から取得。複数選択でOR絞り込み（APIのgenreパラメータに準拠） -->
      <fieldset class="field-group">
        <legend id="genre-legend">ジャンルで絞り込む</legend>
        <div class="chip-group" id="genre-chip-group" role="group" aria-labelledby="genre-legend"></div>
      </fieldset>

      <!-- やりたい分野をハッシュタグ的に追加。GET /api/posts の tags パラメータに渡す（OR絞り込み） -->
      <div class="field-group">
        <label class="field-group__label" for="tag-input">やりたい分野を追加</label>
        <div class="tag-input-row">
          <input type="text" id="tag-input" placeholder="例: 写真, 手作り">
        </div>
        <ul class="tag-chip-list" id="tag-chip-list"></ul>
      </div>

      <div class="filter-actions">
        <button type="submit" class="btn btn-search">検索する</button>
        <button type="button" class="btn btn-clear" id="reset-btn">条件をクリア</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="results-heading">
    <div class="results-header">
      <h2 id="results-heading">検索結果</h2>
      <p id="results-count" aria-live="polite"></p>
    </div>
    <div class="results-grid" id="results-grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <h2>条件に合う投稿が見つかりませんでした</h2>
      <p>予算やジャンル、やりたい分野を変えて、もう一度探してみてください。</p>
      <button type="button" id="empty-reset-btn">絞り込みをリセット</button>
    </div>
    <div class="empty-state" id="fetch-error" hidden>
      <h2>検索結果を取得できませんでした</h2>
      <p>通信環境をご確認のうえ、もう一度お試しください。</p>
      <button type="button" id="retry-btn">再試行する</button>
    </div>
  </section>
</main>

<script src="../shared/common.js"></script>
<script>
  /* API_BASE / resolveUrl / getLikedIds / saveLikedIds / setPostLike /
     updateLikeButton などの共通処理は shared/common.js にある */

  /* ============================================================
     GENRES（GET /api/genres から取得。取得できるまでは空のまま）
     ============================================================ */
  let GENRES = [];

  const likedIds = getLikedIds();

  /* ============================================================
     ログイン状態（認証がないためlocalStorageのモック）
     ============================================================ */
  const CURRENT_USER_KEY = "oshipi:currentUser";
  function isLoggedIn() {
    try {
      return JSON.parse(localStorage.getItem(CURRENT_USER_KEY) ?? "null") !== null;
    } catch {
      return false;
    }
  }
  function showLoginRequiredMessage(anchorEl) {
    const existing = anchorEl.parentElement.querySelector(".login-required-msg");
    if (existing) existing.remove();
    const msg = document.createElement("span");
    msg.className = "login-required-msg";
    msg.setAttribute("role", "alert");
    msg.textContent = "ログインが必要です";
    anchorEl.insertAdjacentElement("afterend", msg);
    setTimeout(() => msg.remove(), 2500);
  }

  /* ============================================================
     STATE
     ============================================================ */
  const filterState = {
    budgetMin: null,
    budgetMax: null,
    includeNullBudget: true,
    durationMin: null,
    durationMax: null,
    includeNullDuration: true,
    genres: new Set(),
    tags: [],
  };

  // 検索リクエストは非同期なので、古いレスポンスで新しい結果を
  // 上書きしないよう、リクエストごとに連番を振って最新だけ反映する
  let requestSeq = 0;

  /* escapeHtml / formatBudget / formatDuration / formatDateShort /
     placeholderClass / debounce は shared/common.js にある */

  /* ============================================================
     GENRE CHIPS
     ============================================================ */
  function renderGenreChips() {
    const group = document.getElementById("genre-chip-group");
    group.innerHTML = "";
    GENRES.forEach((g) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = g.label;
      btn.dataset.genre = g.key;
      btn.setAttribute("aria-pressed", "false");
      btn.addEventListener("click", () => {
        const active = !filterState.genres.has(g.key);
        if (active) filterState.genres.add(g.key);
        else filterState.genres.delete(g.key);
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-pressed", String(active));
        applyFilters();
      });
      group.appendChild(btn);
    });
  }

  /* ============================================================
     TAG INPUT
     ============================================================ */
  function renderTagChips() {
    const list = document.getElementById("tag-chip-list");
    list.innerHTML = "";
    filterState.tags.forEach((tag) => {
      const li = document.createElement("li");
      li.className = "tag-chip";
      const span = document.createElement("span");
      span.textContent = `#${tag}`;
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.textContent = "×";
      removeBtn.setAttribute("aria-label", `${tag}タグを削除`);
      removeBtn.addEventListener("click", () => {
        filterState.tags = filterState.tags.filter((t) => t !== tag);
        renderTagChips();
        applyFilters();
      });
      li.append(span, removeBtn);
      list.appendChild(li);
    });
  }

  function addTagFromInput() {
    const input = document.getElementById("tag-input");
    const value = input.value.trim().replace(/^#/, "");
    const alreadyAdded = filterState.tags.some((t) => t.toLowerCase() === value.toLowerCase());
    if (value && !alreadyAdded) {
      filterState.tags.push(value);
      renderTagChips();
      applyFilters();
    }
    input.value = "";
  }

  /* ============================================================
     API
     ============================================================ */
  async function fetchGenres() {
    try {
      const res = await fetch(`${API_BASE}/api/genres`);
      if (!res.ok) throw new Error(`ジャンル一覧の取得に失敗しました (${res.status})`);
      const data = await res.json();
      GENRES = data.genres ?? [];
    } catch (err) {
      console.error(err);
      // ジャンル一覧が取れなくても、予算・タグでの検索は続行できるようにする
      GENRES = [];
    }
    renderGenreChips();
  }

  /* ============================================================
     範囲入力のバリデーション（最小 > 最大だと必ず0件になるため、
     検索を投げる前にフロント側で気づけるようにする）
     ============================================================ */
  function updateRangeUI(minId, maxId, errorId, min, max) {
    const minInput = document.getElementById(minId);
    const maxInput = document.getElementById(maxId);

    const isValid = !(min !== null && max !== null && min > max);
    document.getElementById(errorId).hidden = isValid;

    // 逆転入力をしにくくする（スピンボタン操作時のガード。直接入力までは防げない）
    if (max !== null) minInput.max = String(max);
    else minInput.removeAttribute("max");
    maxInput.min = min !== null ? String(min) : "0";

    return isValid;
  }

  function updateBudgetRangeUI() {
    return updateRangeUI("budget-min", "budget-max", "budget-error",
      filterState.budgetMin, filterState.budgetMax);
  }

  function updateDurationRangeUI() {
    return updateRangeUI("duration-min", "duration-max", "duration-error",
      filterState.durationMin, filterState.durationMax);
  }

  /* APIに budgetMin/budgetMax を渡すと、SQLのNULL比較で予算未設定(budget: null)の投稿が
     必ず除外される。「予算未設定の投稿も表示する」がONで予算が入力されているときだけ、
     予算条件をAPIに渡さずに取得し、手元で絞り込む */
  function filtersBudgetOnClient() {
    return filterState.includeNullBudget
      && (filterState.budgetMin !== null || filterState.budgetMax !== null);
  }

  /* APIには durationMax しか無いので、最短を指定したときは必ず手元で絞り込む。
     「時間未設定も表示する」がONのときは、予算と同じ理由で durationMax も渡せない */
  function filtersDurationOnClient() {
    return filterState.durationMin !== null
      || (filterState.includeNullDuration && filterState.durationMax !== null);
  }

  function buildSearchParams() {
    const params = new URLSearchParams();
    if (!filtersBudgetOnClient()) {
      if (filterState.budgetMin !== null) params.set("budgetMin", String(filterState.budgetMin));
      if (filterState.budgetMax !== null) params.set("budgetMax", String(filterState.budgetMax));
    }
    if (!filtersDurationOnClient() && filterState.durationMax !== null) {
      params.set("durationMax", String(filterState.durationMax));
    }
    if (filterState.genres.size > 0) params.set("genre", [...filterState.genres].join(","));
    if (filterState.tags.length > 0) params.set("tags", filterState.tags.join(","));
    params.set("limit", "100"); // ページングUIが無いので、上限いっぱいまで一度に取得する
    return params;
  }

  function matchesBudget(post) {
    if (post.budget === null) return true; // 予算未設定は残す
    const { budgetMin, budgetMax } = filterState;
    if (budgetMin !== null && post.budget < budgetMin) return false;
    if (budgetMax !== null && post.budget > budgetMax) return false;
    return true;
  }

  function matchesDuration(post) {
    if (post.durationMin === null) return filterState.includeNullDuration;
    const { durationMin, durationMax } = filterState;
    if (durationMin !== null && post.durationMin < durationMin) return false;
    if (durationMax !== null && post.durationMin > durationMax) return false;
    return true;
  }

  function filterPostsOnClient(data) {
    const needsBudget = filtersBudgetOnClient();
    const needsDuration = filtersDurationOnClient();
    if (!needsBudget && !needsDuration) return data;

    const posts = data.posts.filter((post) =>
      (!needsBudget || matchesBudget(post)) && (!needsDuration || matchesDuration(post))
    );

    // 条件の一部をAPIに渡していないぶん data.total は絞り込み前の件数なので数え直す
    return { ...data, posts, total: posts.length };
  }

  /* ============================================================
     FILTER / FETCH
     ============================================================ */
  async function applyFilters() {
    const grid = document.getElementById("results-grid");
    const emptyState = document.getElementById("empty-state");
    const fetchError = document.getElementById("fetch-error");
    const countEl = document.getElementById("results-count");

    // 片方でも範囲が逆転していると必ず0件になるので、検索自体を送らない。
    // 両方チェックしてから判定し、エラー表示が片方だけ残らないようにする
    const budgetOk = updateBudgetRangeUI();
    const durationOk = updateDurationRangeUI();
    if (!budgetOk || !durationOk) {
      grid.innerHTML = "";
      grid.hidden = true;
      emptyState.hidden = true;
      fetchError.hidden = true;
      countEl.textContent = "";
      return;
    }

    const seq = ++requestSeq;
    emptyState.hidden = true;
    fetchError.hidden = true;
    countEl.textContent = "検索中…";

    try {
      const res = await fetch(`${API_BASE}/api/posts?${buildSearchParams().toString()}`);
      if (seq !== requestSeq) return; // 後から送った検索の結果だけを反映する
      if (!res.ok) throw new Error(`検索に失敗しました (${res.status})`);
      const data = await res.json();
      if (seq !== requestSeq) return;
      render(filterPostsOnClient(data));
    } catch (err) {
      if (seq !== requestSeq) return;
      console.error(err);
      grid.innerHTML = "";
      grid.hidden = true;
      countEl.textContent = "";
      fetchError.hidden = false;
    }
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function renderCard(post, index) {
    // カード内にいいねボタン(<button>)を置くため、外枠は<a>ではなく<article>にし、
    // 遷移用のリンクは全面を覆う透明な<a>として別に重ねる(<a>はインタラクティブ要素を子孫に持てないため)
    const card = document.createElement("article");
    card.className = "card";

    const cardLink = document.createElement("a");
    cardLink.className = "card__link";
    cardLink.href = `../detail/index.html?id=${encodeURIComponent(post.id)}`;
    cardLink.setAttribute(
      "aria-label",
      `${post.title}、${post.genreLabel}、予算${formatBudget(post.budget)}の詳細を見る`
    );
    card.append(cardLink);

    // 所要時間は探すときの判断材料になりやすいので、他のメタ情報より少し強調する
    const metaParts = [
      post.prefecture || null,
      post.steps.length > 0 ? `手順${post.steps.length}つ` : null,
    ].filter(Boolean);

    const thumbImage = post.images && post.images[0];
    const liked = likedIds.has(post.id);

    card.insertAdjacentHTML("beforeend", `
      <div class="card__media ${thumbImage ? "" : placeholderClass(index)}">
        ${thumbImage
          ? `<img src="${escapeHtml(resolveUrl(thumbImage))}" alt="${escapeHtml(post.title)}">`
          : `<span class="card__media-letter" aria-hidden="true">${escapeHtml(post.genreLabel.slice(0, 1))}</span>`}
        <span class="card__price">${formatBudget(post.budget)}</span>
      </div>
      <div class="card__body">
        <span class="card__genre-badge">${escapeHtml(post.genreLabel)}</span>
        <h3 class="card__title">${escapeHtml(post.title)}</h3>
        <p class="card__duration"><span aria-hidden="true">⏱</span>${escapeHtml(formatDuration(post.durationMin))}</p>
        ${metaParts.length > 0 ? `<p class="card__meta">${escapeHtml(metaParts.join(" ・ "))}</p>` : ""}
        <p class="card__desc">${escapeHtml(post.tip || post.body)}</p>
        <div class="card__footer">
          <span>${escapeHtml(post.authorName)} ・ ${formatDateShort(post.createdAt)}</span>
          <button type="button" class="card__like-btn" data-id="${post.id}"></button>
        </div>
      </div>
    `);
    // 初期表示もクリック後の更新も同じ updateLikeButton を通す
    updateLikeButton(card.querySelector(".card__like-btn"), liked, post.likeCount);
    return card;
  }

  function render(data) {
    const grid = document.getElementById("results-grid");
    const emptyState = document.getElementById("empty-state");
    const countEl = document.getElementById("results-count");

    grid.innerHTML = "";
    data.posts.forEach((post, index) => grid.appendChild(renderCard(post, index)));

    const isEmpty = data.posts.length === 0;
    countEl.textContent = data.hasMore
      ? `${data.total}件中${data.posts.length}件を表示中`
      : `${data.total}件見つかりました`;
    emptyState.hidden = !isEmpty;
    grid.hidden = isEmpty;
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  function resetFilters() {
    filterState.budgetMin = null;
    filterState.budgetMax = null;
    filterState.includeNullBudget = true;
    filterState.durationMin = null;
    filterState.durationMax = null;
    filterState.includeNullDuration = true;
    filterState.genres.clear();
    filterState.tags = [];

    document.getElementById("budget-min").value = "";
    document.getElementById("budget-max").value = "";
    document.getElementById("include-null-budget").checked = true;
    document.getElementById("duration-min").value = "";
    document.getElementById("duration-max").value = "";
    document.getElementById("include-null-duration").checked = true;
    document.getElementById("tag-input").value = "";
    document.querySelectorAll("#genre-chip-group .chip").forEach((c) => {
      c.classList.remove("is-active");
      c.setAttribute("aria-pressed", "false");
    });
    renderTagChips();
    applyFilters();
  }

  function initEvents() {
    const form = document.getElementById("search-form");
    const budgetMin = document.getElementById("budget-min");
    const budgetMax = document.getElementById("budget-max");
    const tagInput = document.getElementById("tag-input");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      applyFilters();
    });

    const debouncedApply = debounce(applyFilters, 150);

    budgetMin.addEventListener("input", () => {
      filterState.budgetMin = budgetMin.value === "" ? null : Number(budgetMin.value);
      debouncedApply();
    });

    budgetMax.addEventListener("input", () => {
      filterState.budgetMax = budgetMax.value === "" ? null : Number(budgetMax.value);
      debouncedApply();
    });

    const includeNullBudget = document.getElementById("include-null-budget");
    includeNullBudget.addEventListener("change", () => {
      filterState.includeNullBudget = includeNullBudget.checked;
      applyFilters();
    });

    const durationMin = document.getElementById("duration-min");
    const durationMax = document.getElementById("duration-max");

    durationMin.addEventListener("input", () => {
      filterState.durationMin = durationMin.value === "" ? null : Number(durationMin.value);
      debouncedApply();
    });

    durationMax.addEventListener("input", () => {
      filterState.durationMax = durationMax.value === "" ? null : Number(durationMax.value);
      debouncedApply();
    });

    const includeNullDuration = document.getElementById("include-null-duration");
    includeNullDuration.addEventListener("change", () => {
      filterState.includeNullDuration = includeNullDuration.checked;
      applyFilters();
    });

    tagInput.addEventListener("keydown", (e) => {
      if (e.isComposing) return;
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        addTagFromInput();
      }
    });

    document.getElementById("reset-btn").addEventListener("click", resetFilters);
    document.getElementById("empty-reset-btn").addEventListener("click", resetFilters);
    document.getElementById("retry-btn").addEventListener("click", applyFilters);
  }

  /* ============================================================
     LIKE（POST/DELETE /api/posts/:id/like を叩く。誰が押したかは
     サーバー側で持たないので、自分が押したかどうかはlocalStorageで管理する。
     カードは再描画されるので、親要素への委任で1つのリスナーだけ使う）
     ============================================================ */
  function initLikeButton() {
    document.getElementById("results-grid").addEventListener("click", async (e) => {
      const btn = e.target.closest(".card__like-btn");
      if (!btn || btn.disabled) return;
      e.preventDefault();
      e.stopPropagation();

      if (!isLoggedIn()) {
        showLoginRequiredMessage(btn);
        return;
      }

      const postId = btn.dataset.id;
      const nextLiked = !likedIds.has(postId);

      btn.disabled = true;
      try {
        const likeCount = await setPostLike(postId, nextLiked);
        nextLiked ? likedIds.add(postId) : likedIds.delete(postId);
        saveLikedIds(likedIds);
        updateLikeButton(btn, nextLiked, likeCount);
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });
  }

  /* ============================================================
     INIT
     ============================================================ */
  renderTagChips();
  initEvents();
  initLikeButton();
  fetchGenres();
  applyFilters();
</script>
</body>
</html>
