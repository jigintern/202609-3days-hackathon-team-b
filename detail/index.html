<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳細画面</title>
<style>
  :root {
    --accent: #FFEF6C;
    --accent-dark: #E8D400;
    --text: #222222;
    --text-sub: #6B6B6B;
    --line: #ECECEC;
    --bg: #FFFFFF;
    --bg-soft: #FAFAFA;
    --danger: #FF5C7A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-soft);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Navbar */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .navbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    text-decoration: none;
    flex-shrink: 0;
  }
  .nav-links {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }
  .nav-links a {
    color: var(--text-sub);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .nav-links a:hover { color: var(--text); }

  /* Layout */
  .layout {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-areas:
      "main side"
      "reports reports";
    gap: 24px 32px;
  }
  .main-col { grid-area: main; min-width: 0; }
  .side-col {
    grid-area: side;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 88px;
    align-self: start;
  }
  .report-section { grid-area: reports; }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-areas: "main" "side" "reports";
    }
    .side-col { position: static; }
  }

  .breadcrumb {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-sub);
    text-decoration: none;
  }
  .breadcrumb:hover { color: var(--text); }

  /* Gallery */
  .gallery-main {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(135deg, #FFF6C4, #FFEF6C);
  }
  .gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-thumbs {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .gallery-thumbs img {
    width: 84px;
    height: 64px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    opacity: .7;
  }
  .gallery-thumbs img.active,
  .gallery-thumbs img:hover {
    border-color: var(--accent-dark);
    opacity: 1;
  }

  .genre-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 20px;
  }

  .title {
    font-size: 26px;
    font-weight: 800;
    margin: 12px 0 8px;
    line-height: 1.4;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 20px;
  }

  /* Generic card */
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    margin: 0 0 14px;
  }
  .card h3::before {
    content: "";
    width: 4px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }

  .desc-text {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .material-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .material-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 10px;
  }
  .material-list li .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-dark);
    flex-shrink: 0;
  }

  .step-list {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: step;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step-list li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .step-list li::before {
    content: counter(step);
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tip-card {
    display: flex;
    gap: 10px;
    background: #FFFCE8;
    border: 1px solid #F5EBAE;
  }
  .tip-card .icon { font-size: 18px; }
  .tip-card p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--text); }

  /* Sidebar: stats */
  .stat-card-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stat-row .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .stat-row .label { font-size: 12px; color: var(--text-sub); }
  .stat-row .value { font-size: 15px; font-weight: 700; margin-top: 2px; }

  /* Sidebar: actions */
  .action-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .like-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
    transition: background .15s, border-color .15s;
  }
  .like-btn .heart { font-size: 16px; }
  .like-btn.liked {
    background: var(--accent);
    border-color: var(--accent-dark);
  }
  .share-btn {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
  }
  .share-btn:hover { background: var(--bg-soft); }

  /* Report (行ってきましたレポート) */
  .report-item {
    display: flex;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .report-item:last-child { border-bottom: none; }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .report-body { flex: 1; min-width: 0; }
  .report-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .report-text {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text);
  }
  .report-image {
    margin-top: 8px;
    width: 100%;
    max-width: 220px;
    aspect-ratio: 4/3;
    border-radius: 12px;
    object-fit: cover;
    display: block;
  }
  .report-footer {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    color: var(--text-sub);
    font-size: 12px;
  }
  .report-like-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
  }
  .report-like-btn.liked { color: var(--danger); font-weight: 700; }

  .report-form {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .report-form textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
  }
  .report-form textarea:focus { outline: none; border-color: var(--accent-dark); }
  .report-form-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .attach-btn {
    border: 1px dashed #CFCFCF;
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
  }
  .submit-btn {
    border: none;
    background: var(--accent);
    color: var(--text);
    font-weight: 800;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
  }
  .submit-btn:active { background: var(--accent-dark); }
  .submit-btn:disabled {
    background: var(--bg-soft);
    color: #B7B7B7;
    cursor: not-allowed;
  }

  .section-count {
    font-weight: 400;
    color: var(--text-sub);
    font-size: 13px;
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <span class="logo">
      オシピ！
    </span>
    <nav class="nav-links">
      <a href="../index.html">トップ</a>
      <a href="../search/index.html">予算で探す</a>
      <a href="../post/index.html">投稿する</a>
    </nav>
  </div>
</header>

<main class="layout">
  <div class="main-col">
    <a class="breadcrumb" href="../search/index.html">← 一覧へ戻る</a>

    <div class="gallery-main">
      <img id="heroMain" alt="">
    </div>
    <div class="gallery-thumbs" id="heroThumbs"></div>

    <span class="genre-badge" id="genreBadge"></span>
    <h1 class="title" id="postTitle"></h1>
    <div class="meta-row">👤 <span id="postAuthor"></span> ・ <span id="postDate"></span></div>

    <div class="card">
      <h3>概要</h3>
      <p class="desc-text" id="postDesc"></p>
    </div>

    <div class="card">
      <h3>材料 <span class="section-count" id="materialCount"></span></h3>
      <ul class="material-list" id="materialList"></ul>
    </div>

    <div class="card">
      <h3>手順</h3>
      <ol class="step-list" id="stepList"></ol>
    </div>

    <div class="card tip-card" id="tipCard">
      <div class="icon">💡</div>
      <p id="tipText"></p>
    </div>
  </div>

  <aside class="side-col">
    <div class="card stat-card-group">
      <div class="stat-row">
        <span class="icon">📍</span>
        <div>
          <div class="label">開催地</div>
          <div class="value" id="statArea"></div>
        </div>
      </div>
      <div class="stat-row">
        <span class="icon">⏱️</span>
        <div>
          <div class="label">所要時間</div>
          <div class="value" id="statTime"></div>
        </div>
      </div>
      <div class="stat-row">
        <span class="icon">💰</span>
        <div>
          <div class="label">予算</div>
          <div class="value" id="statBudget"></div>
        </div>
      </div>
    </div>

    <div class="card action-card">
      <button class="like-btn" id="likeBtn">
        <span class="heart">🤍</span>
        <span id="likeCount"></span>
      </button>
      <button class="share-btn" id="shareBtn">📤 共有する</button>
    </div>
  </aside>

  <section class="report-section card">
    <h3>行ってきましたレポート <span class="section-count" id="reportCount"></span></h3>
    <div id="reportList"></div>

    <div class="report-form">
      <textarea id="reportInput" placeholder="実際にやってみた感想を書いてみよう！"></textarea>
      <div class="report-form-actions">
        <input type="file" id="reportImageInput" accept="image/*" hidden>
        <button class="attach-btn" type="button" id="attachBtn">📷 画像を追加</button>
        <button class="submit-btn" id="submitReport" disabled>投稿する</button>
      </div>
    </div>
  </section>
</main>

<script>
  // ------- Mock data（後でAPIに差し替え予定） -------
  const post = {
    genre: "グッズ制作",
    title: "推しの缶バッジ風アクセサリー作り",
    author: "みさき",
    date: "2026/09/10",
    area: "東京都",
    time: "約3時間",
    budget: "2,500円",
    images: [
      "https://placehold.jp/ffef6c/222222/600x450.png?text=完成写真",
      "https://placehold.jp/f5f5f5/222222/600x450.png?text=材料一覧",
      "https://placehold.jp/f5f5f5/222222/600x450.png?text=作業風景"
    ],
    desc: "推しのイラストを使ったオリジナル缶バッジを手作りしました。\n100均とお店で揃う材料だけで、初心者でも30分〜1時間ほどで完成します！",
    materials: [
      "缶バッジキット(38mm) ×5",
      "コピー用紙（印刷用）",
      "はさみ・カッター",
      "クリアシール",
      "推しのイラストデータ"
    ],
    steps: [
      "好きな推しのイラストを印刷する",
      "缶バッジのテンプレートサイズに合わせて丸く切り抜く",
      "キットのパーツにイラストをセットする",
      "専用プレス機でしっかり圧着する",
      "完成！ピンやマグネットをつけて持ち歩こう"
    ],
    tip: "近くに「手芸センタードリーム 新宿店」があるので、材料調達に立ち寄るのがおすすめです。",
    likeCount: 128,
    liked: false
  };

  let reports = [
    {
      id: 1,
      name: "ゆか",
      text: "実際に作ってみました！思ったより簡単で30分で完成しました✨",
      image: "https://placehold.jp/fafafa/222222/400x300.png?text=完成品",
      likes: 12,
      liked: false
    },
    {
      id: 2,
      name: "たくみ",
      text: "缶バッジキットが100均でも売っていたので、さらに節約できました！",
      image: null,
      likes: 8,
      liked: false
    }
  ];

  // ------- Helpers -------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  // ------- Render -------
  let activeImageIndex = 0;
  function renderGallery() {
    const mainImg = document.getElementById("heroMain");
    mainImg.src = post.images[activeImageIndex];
    mainImg.alt = escapeHtml(post.title);

    const thumbs = document.getElementById("heroThumbs");
    thumbs.innerHTML = post.images.map((src, i) =>
      `<img src="${src}" class="${i === activeImageIndex ? "active" : ""}" data-index="${i}" alt="サムネイル${i + 1}">`
    ).join("");

    thumbs.querySelectorAll("img").forEach(img => {
      img.addEventListener("click", () => {
        activeImageIndex = Number(img.dataset.index);
        renderGallery();
      });
    });
  }

  function renderPost() {
    document.getElementById("genreBadge").textContent = post.genre;
    document.getElementById("postTitle").textContent = post.title;
    document.getElementById("postAuthor").textContent = post.author;
    document.getElementById("postDate").textContent = post.date;
    document.getElementById("statArea").textContent = post.area;
    document.getElementById("statTime").textContent = post.time;
    document.getElementById("statBudget").textContent = post.budget;
    document.getElementById("postDesc").textContent = post.desc;

    document.getElementById("materialCount").textContent = `(${post.materials.length})`;
    document.getElementById("materialList").innerHTML = post.materials
      .map(m => `<li><span class="dot"></span>${escapeHtml(m)}</li>`).join("");

    document.getElementById("stepList").innerHTML = post.steps
      .map(s => `<li>${escapeHtml(s)}</li>`).join("");

    document.getElementById("tipText").textContent = post.tip;
    document.getElementById("tipCard").style.display = post.tip ? "flex" : "none";

    updateLikeUI();
  }

  function updateLikeUI() {
    const btn = document.getElementById("likeBtn");
    btn.classList.toggle("liked", post.liked);
    btn.querySelector(".heart").textContent = post.liked ? "❤️" : "🤍";
    document.getElementById("likeCount").textContent = post.likeCount;
  }

  function renderReports() {
    document.getElementById("reportCount").textContent = `(${reports.length})`;
    document.getElementById("reportList").innerHTML = reports.map(r => `
      <div class="report-item">
        <div class="avatar">${escapeHtml(r.name.charAt(0))}</div>
        <div class="report-body">
          <div class="report-name">${escapeHtml(r.name)}</div>
          <div class="report-text">${escapeHtml(r.text)}</div>
          ${r.image ? `<img class="report-image" src="${r.image}" alt="レポート画像">` : ""}
          <div class="report-footer">
            <button class="report-like-btn ${r.liked ? "liked" : ""}" data-id="${r.id}">
              ${r.liked ? "❤️" : "🤍"} ${r.likes}
            </button>
          </div>
        </div>
      </div>
    `).join("");
  }

  // ------- Events -------
  document.getElementById("likeBtn").addEventListener("click", () => {
    post.liked = !post.liked;
    post.likeCount += post.liked ? 1 : -1;
    updateLikeUI();
  });

  document.getElementById("shareBtn").addEventListener("click", async () => {
    const shareData = { title: post.title, text: post.desc, url: location.href };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch (err) { /* ユーザーがキャンセル */ }
      return;
    }
    if (navigator.clipboard) {
      try {
        await navigator.clipboard.writeText(location.href);
        alert("URLをコピーしました");
        return;
      } catch (err) { /* クリップボード権限なし → フォールバック */ }
    }
    alert(location.href);
  });

  // いいねボタンはレポートを再描画するたびに増えるので、
  // 親要素への委任で1つのリスナーだけを使う
  document.getElementById("reportList").addEventListener("click", (e) => {
    const btn = e.target.closest(".report-like-btn");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const r = reports.find(x => x.id === id);
    r.liked = !r.liked;
    r.likes += r.liked ? 1 : -1;
    renderReports();
  });

  const reportInput = document.getElementById("reportInput");
  const submitBtn = document.getElementById("submitReport");
  const attachBtn = document.getElementById("attachBtn");
  const reportImageInput = document.getElementById("reportImageInput");
  let attachedImage = null;

  reportInput.addEventListener("input", () => {
    submitBtn.disabled = reportInput.value.trim().length === 0;
  });

  attachBtn.addEventListener("click", () => reportImageInput.click());
  reportImageInput.addEventListener("change", () => {
    const file = reportImageInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      attachedImage = reader.result;
      attachBtn.textContent = `✅ ${file.name}`;
    };
    reader.readAsDataURL(file);
  });

  submitBtn.addEventListener("click", () => {
    const text = reportInput.value.trim();
    if (!text) return;
    reports = [{ id: Date.now(), name: "あなた", text, image: attachedImage, likes: 0, liked: false }, ...reports];
    reportInput.value = "";
    reportImageInput.value = "";
    attachedImage = null;
    attachBtn.textContent = "📷 画像を追加";
    submitBtn.disabled = true;
    renderReports();
  });

  renderGallery();
  renderPost();
  renderReports();
</script>

</body>
</html>
