<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳細画面</title>
<style>
  :root {
    --accent: #FFEF6C;
    --accent-dark: #E8D400;
    --text: #222222;
    --text-sub: #6B6B6B;
    --line: #ECECEC;
    --bg: #FFFFFF;
    --bg-soft: #FAFAFA;
    --danger: #FF5C7A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-soft);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    padding-bottom: 96px;
    position: relative;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--line); }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text-sub);
  }

  /* Hero image */
  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #FFF6C4, #FFEF6C);
    overflow-x: auto;
    display: flex;
    scroll-snap-type: x mandatory;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    flex-shrink: 0;
    scroll-snap-align: start;
  }
  .hero-dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  .hero-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
  }
  .hero-dots span.active { background: #fff; }

  .content { padding: 16px; }

  .genre-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }

  h2.title {
    font-size: 20px;
    font-weight: 800;
    margin: 10px 0 6px;
    line-height: 1.4;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 4px;
  }

  /* Stat chips: area / duration / budget */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .stat-card {
    background: var(--bg-soft);
    border-radius: 14px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-card .icon { font-size: 18px; }
  .stat-card .label {
    font-size: 10px;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .stat-card .value {
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
    word-break: break-word;
  }

  /* Generic card */
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    margin: 0 0 12px;
  }
  .card h3::before {
    content: "";
    width: 4px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }

  .desc-text {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .material-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .material-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 10px;
  }
  .material-list li .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-dark);
    flex-shrink: 0;
  }

  .step-list {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: step;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step-list li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .step-list li::before {
    content: counter(step);
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tip-card {
    display: flex;
    gap: 10px;
    background: #FFFCE8;
    border: 1px solid #F5EBAE;
  }
  .tip-card .icon { font-size: 18px; }
  .tip-card p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--text); }

  /* Like row */
  .like-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 18px;
  }
  .like-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
    transition: background .15s, border-color .15s;
  }
  .like-btn .heart { font-size: 16px; }
  .like-btn.liked {
    background: var(--accent);
    border-color: var(--accent-dark);
  }
  .share-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg);
    cursor: pointer;
    font-size: 16px;
  }

  /* Report (行ってきましたレポート) */
  .report-item {
    display: flex;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .report-item:last-child { border-bottom: none; }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .report-body { flex: 1; min-width: 0; }
  .report-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .report-text {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text);
  }
  .report-image {
    margin-top: 8px;
    width: 100%;
    max-width: 220px;
    aspect-ratio: 4/3;
    border-radius: 12px;
    object-fit: cover;
    display: block;
  }
  .report-footer {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    color: var(--text-sub);
    font-size: 12px;
  }
  .report-like-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
  }
  .report-like-btn.liked { color: var(--danger); font-weight: 700; }

  .report-form {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .report-form textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 64px;
  }
  .report-form textarea:focus { outline: none; border-color: var(--accent-dark); }
  .report-form-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .attach-btn {
    border: 1px dashed #CFCFCF;
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
  }
  .submit-btn {
    border: none;
    background: var(--accent);
    color: var(--text);
    font-weight: 800;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
  }
  .submit-btn:active { background: var(--accent-dark); }
  .submit-btn:disabled {
    background: var(--bg-soft);
    color: #B7B7B7;
    cursor: not-allowed;
  }

  .section-count {
    font-weight: 400;
    color: var(--text-sub);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <button class="back-btn" aria-label="戻る">←</button>
    <h1>投稿詳細</h1>
  </header>

  <div class="hero" id="hero"></div>

  <div class="content">
    <span class="genre-badge" id="genreBadge"></span>
    <h2 class="title" id="postTitle"></h2>
    <div class="meta-row">👤 <span id="postAuthor"></span> ・ <span id="postDate"></span></div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="icon">📍</div>
        <div class="label">開催地</div>
        <div class="value" id="statArea"></div>
      </div>
      <div class="stat-card">
        <div class="icon">⏱️</div>
        <div class="label">所要時間</div>
        <div class="value" id="statTime"></div>
      </div>
      <div class="stat-card">
        <div class="icon">💰</div>
        <div class="label">予算</div>
        <div class="value" id="statBudget"></div>
      </div>
    </div>

    <div class="card">
      <h3>概要</h3>
      <p class="desc-text" id="postDesc"></p>
    </div>

    <div class="card">
      <h3>材料 <span class="section-count" id="materialCount"></span></h3>
      <ul class="material-list" id="materialList"></ul>
    </div>

    <div class="card">
      <h3>手順</h3>
      <ol class="step-list" id="stepList"></ol>
    </div>

    <div class="card tip-card" id="tipCard">
      <div class="icon">💡</div>
      <p id="tipText"></p>
    </div>

    <div class="like-row">
      <button class="like-btn" id="likeBtn">
        <span class="heart">🤍</span>
        <span id="likeCount"></span>
      </button>
      <button class="share-btn" aria-label="共有">📤</button>
    </div>

    <div class="card">
      <h3>行ってきましたレポート <span class="section-count" id="reportCount"></span></h3>
      <div id="reportList"></div>

      <div class="report-form">
        <textarea id="reportInput" placeholder="実際にやってみた感想を書いてみよう！"></textarea>
        <div class="report-form-actions">
          <button class="attach-btn" type="button">📷 画像を追加</button>
          <button class="submit-btn" id="submitReport" disabled>投稿する</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ------- Mock data（後でAPIに差し替え予定） -------
  const post = {
    genre: "グッズ制作",
    title: "推しの缶バッジ風アクセサリー作り",
    author: "みさき",
    date: "2026/09/10",
    area: "東京都",
    time: "約3時間",
    budget: "2,500円",
    images: [
      "https://placehold.jp/ffef6c/222222/600x450.png?text=完成写真",
      "https://placehold.jp/f5f5f5/222222/600x450.png?text=材料一覧",
      "https://placehold.jp/f5f5f5/222222/600x450.png?text=作業風景"
    ],
    desc: "推しのイラストを使ったオリジナル缶バッジを手作りしました。\n100均とお店で揃う材料だけで、初心者でも30分〜1時間ほどで完成します！",
    materials: [
      "缶バッジキット(38mm) ×5",
      "コピー用紙（印刷用）",
      "はさみ・カッター",
      "クリアシール",
      "推しのイラストデータ"
    ],
    steps: [
      "好きな推しのイラストを印刷する",
      "缶バッジのテンプレートサイズに合わせて丸く切り抜く",
      "キットのパーツにイラストをセットする",
      "専用プレス機でしっかり圧着する",
      "完成！ピンやマグネットをつけて持ち歩こう"
    ],
    tip: "近くに「手芸センタードリーム 新宿店」があるので、材料調達に立ち寄るのがおすすめです。",
    likeCount: 128,
    liked: false
  };

  let reports = [
    {
      id: 1,
      name: "ゆか",
      text: "実際に作ってみました！思ったより簡単で30分で完成しました✨",
      image: "https://placehold.jp/fafafa/222222/400x300.png?text=完成品",
      likes: 12,
      liked: false
    },
    {
      id: 2,
      name: "たくみ",
      text: "缶バッジキットが100均でも売っていたので、さらに節約できました！",
      image: null,
      likes: 8,
      liked: false
    }
  ];

  // ------- Render -------
  function renderHero() {
    const hero = document.getElementById("hero");
    hero.innerHTML = post.images.map(src => `<img src="${src}" alt="${post.title}">`).join("");
  }

  function renderPost() {
    document.getElementById("genreBadge").textContent = post.genre;
    document.getElementById("postTitle").textContent = post.title;
    document.getElementById("postAuthor").textContent = post.author;
    document.getElementById("postDate").textContent = post.date;
    document.getElementById("statArea").textContent = post.area;
    document.getElementById("statTime").textContent = post.time;
    document.getElementById("statBudget").textContent = post.budget;
    document.getElementById("postDesc").textContent = post.desc;

    document.getElementById("materialCount").textContent = `(${post.materials.length})`;
    document.getElementById("materialList").innerHTML = post.materials
      .map(m => `<li><span class="dot"></span>${m}</li>`).join("");

    document.getElementById("stepList").innerHTML = post.steps
      .map(s => `<li>${s}</li>`).join("");

    document.getElementById("tipText").textContent = post.tip;
    document.getElementById("tipCard").style.display = post.tip ? "flex" : "none";

    updateLikeUI();
  }

  function updateLikeUI() {
    const btn = document.getElementById("likeBtn");
    btn.classList.toggle("liked", post.liked);
    btn.querySelector(".heart").textContent = post.liked ? "❤️" : "🤍";
    document.getElementById("likeCount").textContent = post.likeCount;
  }

  function renderReports() {
    document.getElementById("reportCount").textContent = `(${reports.length})`;
    document.getElementById("reportList").innerHTML = reports.map(r => `
      <div class="report-item">
        <div class="avatar">${r.name.charAt(0)}</div>
        <div class="report-body">
          <div class="report-name">${r.name}</div>
          <div class="report-text">${r.text}</div>
          ${r.image ? `<img class="report-image" src="${r.image}" alt="レポート画像">` : ""}
          <div class="report-footer">
            <button class="report-like-btn ${r.liked ? "liked" : ""}" data-id="${r.id}">
              ${r.liked ? "❤️" : "🤍"} ${r.likes}
            </button>
          </div>
        </div>
      </div>
    `).join("");

    document.querySelectorAll(".report-like-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        const r = reports.find(x => x.id === id);
        r.liked = !r.liked;
        r.likes += r.liked ? 1 : -1;
        renderReports();
      });
    });
  }

  // ------- Events -------
  document.getElementById("likeBtn").addEventListener("click", () => {
    post.liked = !post.liked;
    post.likeCount += post.liked ? 1 : -1;
    updateLikeUI();
  });

  document.getElementById("back-btn");
  document.querySelector(".back-btn").addEventListener("click", () => {
    history.back();
  });

  const reportInput = document.getElementById("reportInput");
  const submitBtn = document.getElementById("submitReport");
  reportInput.addEventListener("input", () => {
    submitBtn.disabled = reportInput.value.trim().length === 0;
  });
  submitBtn.addEventListener("click", () => {
    const text = reportInput.value.trim();
    if (!text) return;
    reports = [{ id: Date.now(), name: "あなた", text, image: null, likes: 0, liked: false }, ...reports];
    reportInput.value = "";
    submitBtn.disabled = true;
    renderReports();
  });

  renderHero();
  renderPost();
  renderReports();
</script>

</body>
</html>
