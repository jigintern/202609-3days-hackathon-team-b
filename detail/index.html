<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳細画面</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent: #FFEF6C;
    --accent-dark: #E8D400;
    --text: #222222;
    --text-sub: #6B6B6B;
    --line: #ECECEC;
    --bg: #FFFFFF;
    --bg-soft: #FAFAFA;
    --danger: #FF5C7A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-soft);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Navbar */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #F7F7F7;
    border-bottom: 1px solid var(--line);
  }
  .navbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Kiwi Maru', serif;
    font-weight: 500;
    font-size: 1.5rem;
    color: #030303;
    text-decoration: none;
    flex-shrink: 0;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .nav-links a {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: #5C5C5C;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .nav-links a:hover { color: #030303; }
  .nav-links a.btn-primary {
    display: inline-block;
    background: var(--accent);
    color: #030303;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0.65em 1.35em;
    border: 1px solid rgba(3, 3, 3, 0.08);
    border-radius: 10px;
    transition: filter 0.15s ease;
  }
  .nav-links a.btn-primary:hover {
    color: #030303;
    filter: brightness(0.92);
  }

  /* Layout */
  .layout {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-areas:
      "main side"
      "reports side";
    gap: 24px 32px;
  }
  .main-col { grid-area: main; min-width: 0; }
  .side-col {
    grid-area: side;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 88px;
    align-self: start;
  }
  .report-section { grid-area: reports; }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-areas: "main" "side" "reports";
    }
    .side-col { position: static; }
  }

  .breadcrumb {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-sub);
    text-decoration: none;
  }
  .breadcrumb:hover { color: var(--text); }

  /* Gallery */
  .gallery-main {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(135deg, #FFF6C4, #FFEF6C);
  }
  .gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-thumbs {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .gallery-thumbs img {
    width: 84px;
    height: 64px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    opacity: .7;
  }
  .gallery-thumbs img.active,
  .gallery-thumbs img:hover {
    border-color: var(--accent-dark);
    opacity: 1;
  }

  .genre-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 20px;
  }

  .title {
    font-size: 26px;
    font-weight: 800;
    margin: 12px 0 8px;
    line-height: 1.4;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 20px;
  }

  /* Generic card */
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    margin: 0 0 14px;
  }
  .card h3::before {
    content: "";
    width: 4px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }

  .desc-text {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .material-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .material-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 10px;
  }
  .material-list li .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-dark);
    flex-shrink: 0;
  }

  .step-list {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: step;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step-list li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .step-list li::before {
    content: counter(step);
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tip-card {
    display: flex;
    gap: 10px;
    background: #FFFCE8;
    border: 1px solid #F5EBAE;
  }
  .tip-card .icon { font-size: 18px; }
  .tip-card p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--text); }

  /* Sidebar: stats */
  .stat-card-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stat-row .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .stat-row .label { font-size: 12px; color: var(--text-sub); }
  .stat-row .value { font-size: 15px; font-weight: 700; margin-top: 2px; }

  /* Sidebar: actions */
  .action-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .like-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
    transition: background .15s, border-color .15s;
  }
  .like-btn .heart { font-size: 16px; }
  .like-btn.liked {
    background: var(--accent);
    border-color: var(--accent-dark);
  }
  .share-btn {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
  }
  .share-btn:hover { background: var(--bg-soft); }

  /* Report (コメント) */
  .report-item {
    display: flex;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .report-item:last-child { border-bottom: none; }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .report-body { flex: 1; min-width: 0; }
  .report-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .report-text {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text);
  }
  .report-image {
    margin-top: 8px;
    width: 100%;
    max-width: 220px;
    aspect-ratio: 4/3;
    border-radius: 12px;
    object-fit: cover;
    display: block;
  }
  .report-footer {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    color: var(--text-sub);
    font-size: 12px;
  }
  .report-like-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
  }
  .report-like-btn.liked { color: var(--danger); font-weight: 700; }

  .report-form {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .report-form textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
  }
  .report-form textarea:focus { outline: none; border-color: var(--accent-dark); }
  .report-form-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .attach-btn {
    border: 1px dashed #CFCFCF;
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
  }
  .submit-btn {
    border: none;
    background: var(--accent);
    color: var(--text);
    font-weight: 800;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
  }
  .submit-btn:active { background: var(--accent-dark); }
  .submit-btn:disabled {
    background: var(--bg-soft);
    color: #B7B7B7;
    cursor: not-allowed;
  }

  .section-count {
    font-weight: 400;
    color: var(--text-sub);
    font-size: 13px;
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="../index.html">
      オシピ！
    </a>
    <nav class="nav-links">
      <a href="../index.html">トップ</a>
      <a href="../search/index.html">予算で探す</a>
      <a class="btn-primary" href="../post/index.html">投稿する</a>
    </nav>
  </div>
</header>

<main class="layout">
  <div class="main-col">
    <a class="breadcrumb" href="../search/index.html">← 一覧へ戻る</a>

    <div class="gallery-main">
      <img id="heroMain" alt="">
    </div>
    <div class="gallery-thumbs" id="heroThumbs"></div>

    <span class="genre-badge" id="genreBadge"></span>
    <h1 class="title" id="postTitle"></h1>
    <div class="meta-row">👤 <span id="postAuthor"></span> ・ <span id="postDate"></span></div>

    <div class="card">
      <h3>概要</h3>
      <p class="desc-text" id="postDesc"></p>
    </div>

    <div class="card">
      <h3>材料 <span class="section-count" id="materialCount"></span></h3>
      <ul class="material-list" id="materialList"></ul>
    </div>

    <div class="card">
      <h3>手順</h3>
      <ol class="step-list" id="stepList"></ol>
    </div>

    <div class="card tip-card" id="tipCard">
      <div class="icon">💡</div>
      <p id="tipText"></p>
    </div>
  </div>

  <aside class="side-col">
    <div class="card stat-card-group">
      <div class="stat-row">
        <span class="icon">📍</span>
        <div>
          <div class="label">開催地</div>
          <div class="value" id="statArea"></div>
        </div>
      </div>
      <div class="stat-row">
        <span class="icon">⏱️</span>
        <div>
          <div class="label">所要時間</div>
          <div class="value" id="statTime"></div>
        </div>
      </div>
      <div class="stat-row">
        <span class="icon">💰</span>
        <div>
          <div class="label">予算</div>
          <div class="value" id="statBudget"></div>
        </div>
      </div>
    </div>

    <div class="card action-card">
      <button class="like-btn" id="likeBtn">
        <span class="heart">🤍</span>
        <span id="likeCount"></span>
      </button>
      <button class="share-btn" id="shareBtn">📤 共有する</button>
    </div>
  </aside>

  <section class="report-section card">
    <h3>コメント <span class="section-count" id="reportCount"></span></h3>
    <div id="reportList"></div>

    <div class="report-form">
      <textarea id="reportInput" placeholder="実際にやってみた感想を書いてみよう！"></textarea>
      <div class="report-form-actions">
        <input type="file" id="reportImageInput" accept="image/*" hidden>
        <button class="attach-btn" type="button" id="attachBtn">📷 画像を追加</button>
        <button class="submit-btn" id="submitReport" disabled>投稿する</button>
      </div>
    </div>
  </section>
</main>

<script>
  // ------- API state -------
  const API_BASE = "https://intern-b.tekitou.app";
  const postId = new URLSearchParams(location.search).get("id");
  let post = null;
  let reports = [];
  let activeImageIndex = 0;

  const LIKED_POSTS_KEY = "oshipi:likedPostIds";
  const LIKED_REPORTS_KEY = "oshipi:likedReports";

  function loadLikedSet(key) {
    try {
      return new Set(JSON.parse(localStorage.getItem(key) ?? "[]"));
    } catch (err) {
      return new Set();
    }
  }
  function saveLikedSet(key, set) {
    try {
      localStorage.setItem(key, JSON.stringify([...set]));
    } catch (err) { /* ストレージ利用不可時は何もしない */ }
  }

  const likedPosts = loadLikedSet(LIKED_POSTS_KEY);
  const likedReports = loadLikedSet(LIKED_REPORTS_KEY);

  // ------- Helpers -------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function formatBudget(yen) {
    if (yen === null || yen === undefined) return "未設定";
    return yen === 0 ? "無料" : `¥${yen.toLocaleString("ja-JP")}`;
  }
  function formatDuration(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h && m) return `${h}時間${m}分`;
    if (h) return `${h}時間`;
    return `${m}分`;
  }
  function formatDate(isoDate) {
    const d = new Date(isoDate);
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
  }

  function resolveUrl(url) {
    if (!url) return url;
    return /^https?:\/\//.test(url) ? url : `${API_BASE}${url}`;
  }

  async function uploadImage(file) {
    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch(`${API_BASE}/api/images`, { method: "POST", body: formData });
    if (!res.ok) throw new Error("画像のアップロードに失敗しました");
    return res.json();
  }

  // ------- Render -------
  function renderGallery() {
    const mainImg = document.getElementById("heroMain");
    mainImg.src = resolveUrl(post.images[activeImageIndex]);
    mainImg.alt = escapeHtml(post.title);

    const thumbs = document.getElementById("heroThumbs");
    thumbs.style.display = post.images.length > 1 ? "flex" : "none";
    thumbs.innerHTML = post.images.map((src, i) =>
      `<img src="${resolveUrl(src)}" class="${i === activeImageIndex ? "active" : ""}" data-index="${i}" alt="サムネイル${i + 1}">`
    ).join("");

    thumbs.querySelectorAll("img").forEach(img => {
      img.addEventListener("click", () => {
        activeImageIndex = Number(img.dataset.index);
        renderGallery();
      });
    });
  }

  function renderPost() {
    document.getElementById("genreBadge").textContent = post.genreLabel;
    document.getElementById("postTitle").textContent = post.title;
    document.getElementById("postAuthor").textContent = post.authorName;
    document.getElementById("postDate").textContent = formatDate(post.createdAt);
    document.getElementById("statArea").textContent = post.prefecture || "ー";
    document.getElementById("statTime").textContent = formatDuration(post.durationMin);
    document.getElementById("statBudget").textContent = formatBudget(post.budget);
    document.getElementById("postDesc").textContent = post.body;

    const materials = post.materials || [];
    document.getElementById("materialCount").textContent = `(${materials.length})`;
    document.getElementById("materialList").innerHTML = materials
      .map(m => `<li><span class="dot"></span>${escapeHtml(m)}</li>`).join("");

    const steps = post.steps || [];
    document.getElementById("stepList").innerHTML = steps
      .map(s => `<li>${escapeHtml(s)}</li>`).join("");

    document.getElementById("tipText").textContent = post.tip || "";
    document.getElementById("tipCard").style.display = post.tip ? "flex" : "none";

    updateLikeUI();
  }

  function updateLikeUI() {
    const btn = document.getElementById("likeBtn");
    const isLiked = likedPosts.has(post.id);
    btn.classList.toggle("liked", isLiked);
    btn.querySelector(".heart").textContent = isLiked ? "❤️" : "🤍";
    document.getElementById("likeCount").textContent = post.likeCount;
  }

  function renderReports() {
    document.getElementById("reportCount").textContent = `(${reports.length})`;
    document.getElementById("reportList").innerHTML = reports.map(r => {
      const isLiked = likedReports.has(r.id);
      return `
      <div class="report-item">
        <div class="avatar">${escapeHtml(r.authorName.charAt(0))}</div>
        <div class="report-body">
          <div class="report-name">${escapeHtml(r.authorName)}</div>
          <div class="report-text">${escapeHtml(r.body)}</div>
          ${r.imageUrl ? `<img class="report-image" src="${resolveUrl(r.imageUrl)}" alt="コメント画像">` : ""}
          <div class="report-footer">
            <button class="report-like-btn ${isLiked ? "liked" : ""}" data-id="${r.id}">
              ${isLiked ? "❤️" : "🤍"} ${r.likeCount}
            </button>
          </div>
        </div>
      </div>
    `;
    }).join("");
  }

  // ------- Events -------
  document.getElementById("likeBtn").addEventListener("click", async () => {
    if (!post) return;
    const isLiked = likedPosts.has(post.id);
    try {
      const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(post.id)}/like`, {
        method: isLiked ? "DELETE" : "POST",
      });
      if (!res.ok) throw new Error("いいねに失敗しました");
      const data = await res.json();
      post.likeCount = data.likeCount;
      if (isLiked) likedPosts.delete(post.id); else likedPosts.add(post.id);
      saveLikedSet(LIKED_POSTS_KEY, likedPosts);
      updateLikeUI();
    } catch (err) {
      console.error(err);
    }
  });

  document.getElementById("shareBtn").addEventListener("click", async () => {
    if (!post) return;
    const shareData = { title: post.title, text: post.body, url: location.href };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch (err) { /* ユーザーがキャンセル */ }
      return;
    }
    if (navigator.clipboard) {
      try {
        await navigator.clipboard.writeText(location.href);
        alert("URLをコピーしました");
        return;
      } catch (err) { /* クリップボード権限なし → フォールバック */ }
    }
    alert(location.href);
  });

  // いいねボタンはレポートを再描画するたびに増えるので、
  // 親要素への委任で1つのリスナーだけを使う
  document.getElementById("reportList").addEventListener("click", async (e) => {
    const btn = e.target.closest(".report-like-btn");
    if (!btn) return;
    const id = btn.dataset.id;
    const isLiked = likedReports.has(id);
    try {
      const res = await fetch(`${API_BASE}/api/reports/${encodeURIComponent(id)}/like`, {
        method: isLiked ? "DELETE" : "POST",
      });
      if (!res.ok) throw new Error("いいねに失敗しました");
      const data = await res.json();
      const r = reports.find(x => x.id === id);
      if (r) r.likeCount = data.likeCount;
      if (isLiked) likedReports.delete(id); else likedReports.add(id);
      saveLikedSet(LIKED_REPORTS_KEY, likedReports);
      renderReports();
    } catch (err) {
      console.error(err);
    }
  });

  const reportInput = document.getElementById("reportInput");
  const submitBtn = document.getElementById("submitReport");
  const attachBtn = document.getElementById("attachBtn");
  const reportImageInput = document.getElementById("reportImageInput");
  let attachedFile = null;

  reportInput.addEventListener("input", () => {
    submitBtn.disabled = reportInput.value.trim().length === 0;
  });

  attachBtn.addEventListener("click", () => reportImageInput.click());
  reportImageInput.addEventListener("change", () => {
    const file = reportImageInput.files[0];
    if (!file) return;
    attachedFile = file;
    attachBtn.textContent = `✅ ${file.name}`;
  });

  submitBtn.addEventListener("click", async () => {
    const text = reportInput.value.trim();
    if (!text || !postId) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "投稿中…";
    try {
      let imageUrl = null;
      if (attachedFile) {
        const uploaded = await uploadImage(attachedFile);
        imageUrl = uploaded.url;
      }
      const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(postId)}/reports`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: text, imageUrl }),
      });
      if (!res.ok) throw new Error("コメントの投稿に失敗しました");
      const created = await res.json();
      reports = [created, ...reports];
      reportInput.value = "";
      reportImageInput.value = "";
      attachedFile = null;
      attachBtn.textContent = "📷 画像を追加";
      renderReports();
    } catch (err) {
      alert(err.message);
    } finally {
      submitBtn.disabled = reportInput.value.trim().length === 0;
      submitBtn.textContent = "投稿する";
    }
  });

  // ------- Init -------
  async function init() {
    if (!postId) {
      document.getElementById("postTitle").textContent = "投稿が指定されていません";
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(postId)}`);
      if (!res.ok) {
        document.getElementById("postTitle").textContent =
          res.status === 404 ? "投稿が見つかりませんでした" : "投稿の読み込みに失敗しました";
        return;
      }
      post = await res.json();
      renderGallery();
      renderPost();

      const reportsRes = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(postId)}/reports`);
      if (reportsRes.ok) {
        const data = await reportsRes.json();
        reports = data.reports;
        renderReports();
      }
    } catch (err) {
      console.error(err);
      document.getElementById("postTitle").textContent = "投稿の読み込みに失敗しました";
    }
  }

  init();
</script>

</body>
</html>
